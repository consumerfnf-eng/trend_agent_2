<script type="module">
console.log("TREND AGENT signal.html v260723-10");
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ══ 설정 — 다른 파일들과 같은 값 ══ */
const SUPABASE_URL  = (window.TA_CONFIG && TA_CONFIG.url)  || 'https://bgyrmztoohrdjkxzylmr.supabase.co';
const SUPABASE_ANON = (window.TA_CONFIG && TA_CONFIG.anon) || 'sb_publishable_JX986aH0CBAEgr7exxvv-g_uGc2Zijm';
/* ═══════════════════════════════ */

const sb = createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = s => document.querySelector(s);
const esc = x => String(x ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = v => String(v||'').toLowerCase().replace(/[\s#_-]/g,'');

/* ══ 정적 데이터 — 예전 trend-agent2 Supabase에서 이관 (2026-07 기준, 하드코딩) ══ */
const FASHION_SIG = [];
const LIFESTYLE_SIG = [
  {"url": "https://www.allurekorea.com/2026/07/20/%eb%af%b8%eb%9d%bc%ed%81%b4-%eb%aa%a8%eb%8b%9d-%ea%b0%80%ea%b3%a0-%ec%8a%ac%eb%a6%bd%eb%a7%a5%ec%8b%b1-%ec%99%94%eb%8b%a4-%ea%bf%80%ec%9e%a0%ec%97%90-%ec%a7%91/", "note": "얼루어 코리아: 미라클 모닝 가고 '슬립맥싱' 왔다, '꿀잠'에 집착하는 Z세대 (2026.07.20)", "category": "etc", "axis": "", "keywords": ["슬립맥싱"], "summary": "실리콘밸리 바이오해킹에서 시작된 수면 최적화 '슬립맥싱'이 Z세대 사이 확산 — 웨어러블로 수면 점수·심박변이도·렘수면 비율을 측정·인증하는 문화, '미라클 모닝'을 대체하는 흐름", "stage": "early", "related": "top", "related_note": "편안한 잠옷·라운지웨어 수요", "image_url": "https://img.allurekorea.com/allure/2026/07/style_6a5d8d58160e9.jpg"},
  {"url": "https://www.allurekorea.com/2026/07/05/%ec%a0%9c%eb%8b%88%eb%8f%84-%eb%b0%98%ed%96%88%eb%8b%a4-%ed%95%9c%ec%97%ac%eb%a6%84-%ec%82%ac%ec%9a%b0%eb%82%98-%ea%b1%b4%ea%b0%95%ed%95%98%EA%B2%8C-%EC%A6%90%EA%B8%B0%EB%8A%94-%EB%B0%A9%EB%B2%95/", "note": "얼루어 코리아: 제니도 반했다! 한여름 사우나 건강하게 즐기는 방법 (2026.07.05)", "category": "etc", "axis": "", "keywords": ["사우나"], "summary": "유흥보다 자기관리를 힙하게 여기는 젊은 세대 — 러닝·요가 후 사우나로 이어지는 루틴 확산, 제니도 콜드플런지·사우나 자기관리 루틴을 SNS에 공유", "stage": "early", "related": "top", "related_note": "사우나 후 편안한 애슬레저·라운지웨어", "image_url": "https://img.allurekorea.com/allure/2026/07/style_6a48c9dbbd069-1200x900.jpg"}
];
let SNS_VIRAL = [];
const CAT_LABEL = {top:'상의',outer:'아우터',pants:'팬츠',shoes:'슈즈',acc:'액세서리',dress:'스커트 & 드레스',bag:'백',etc:'컬러',lifestyle:'라이프스타일'};

/* ── SNS 바이럴 구글시트 실시간 연동 (SHEET_VIRAL) ── */
const SHEET_VIRAL_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS-uKmAPEaO-ee3-Du5iIPFBIQTdVDYbkYJG3fjl_XWKA6vxPHqHzy2kEQjwobfs4a2QOxUuHpMCce/pub?output=csv';

function parseCSV(text){
  const rows = []; let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\r'){ /* skip */ }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  const header = rows.shift() || [];
  return rows.filter(r => r.length > 1 || r[0]).map(r => {
    const obj = {}; header.forEach((h,i) => obj[h] = r[i] ?? ''); return obj;
  });
}

function numKR(v){
  if (v == null) return 0;
  v = String(v).replace(/,/g,'').trim();
  if (v === '' || v === '-') return 0;
  const n = parseInt(v, 10);
  return isNaN(n) ? 0 : n;
}

function mapSnsRow(r){
  return {
    rank: numKR(r['순위']), content: (r['콘텐츠']||'').trim(), cat: (r['중분류']||'').trim(),
    subcat: (r['세부분류']||'').trim(), ad: (r['광고유형']||'').trim(), brand: (r['브랜드']||'').trim(),
    product: (r['제품명']||'').trim(), retailer: (r['유통사']||'').trim(), account: (r['계정/채널']||'').trim(),
    followers: numKR(r['팔로워 수']), score: numKR(r['스코어']), views: numKR(r['조회수']),
    likes: numKR(r['좋아요 수']), comments: numKR(r['댓글 수']),
    account_url: (r['계정 링크']||'').trim(), post_url: (r['게시물 링크']||'').trim(),
  };
}

/* 실패해도 조용히 하드코딩된 시드 데이터로 유지 — 시트 연동 성공 시에만 교체 후 재렌더 */
async function loadSnsSheet(){
  try {
    const res = await fetch(SHEET_VIRAL_URL);
    if (!res.ok) throw new Error('sheet fetch failed: ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text).map(mapSnsRow).filter(r => r.content);
    if (rows.length){ SNS_VIRAL = rows; renderStatic(); }
  } catch (e) {
    console.warn('SNS 시트 실시간 연동 실패 — 하드코딩된 샘플 데이터 유지:', e);
  }
}

let ENTS = [], SIG = [], CNT = {}, COVER = {}, TAGS = [], month = new Date().toISOString().slice(0,7);
let catF = 'All', brandF = 'All';

const SRC_PRI = ['instagram','naver','sometrend','naver_blog','community','google','manual'];
const sigOf = (eid, region, srcOnly) => {
  const all = SIG.filter(s => s.entity_id === eid && (!region || s.region === region));
  if(srcOnly) return all.filter(r => r.source === srcOnly).sort((a,b) => a.week.localeCompare(b.week));
  const src = SRC_PRI.find(x => all.filter(r => r.source === x).length >= 2) || all[0]?.source;
  return all.filter(r => r.source === src).sort((a,b) => a.week.localeCompare(b.week));
};

/* 여러 계열 멀티라인 차트 */
function multiLine(series, w=560, h=150){
  const S = series.filter(x => x.rows.length >= 2);
  if(!S.length) return '<div class="empty">데이터가 아직 없습니다 — 수집 탭에서 CSV 를 올리거나 검색량 갱신을 돌려주세요</div>';
  const weeks = [...new Set(S.flatMap(x => x.rows.map(r => r.week)))].sort();
  const mx = Math.max(...S.flatMap(x => x.rows.map(r => +r.volume)), 1);
  const X = wk => 34 + weeks.indexOf(wk) / Math.max(weeks.length-1,1) * (w-44);
  const Y = v => h-18 - (v/mx)*(h-30);
  const grid = [0,.5,1].map(f => `<line x1="34" x2="${w-10}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="var(--hair)"/>` +
    `<text x="30" y="${Y(mx*f)+3}" text-anchor="end" font-size="8" fill="var(--sub)">${Math.round(mx*f)}</text>`).join('');
  const lines = S.map(x => `<polyline fill="none" stroke="${x.color}" stroke-width="1.8"
      points="${x.rows.map(r=>`${X(r.week).toFixed(1)},${Y(+r.volume).toFixed(1)}`).join(' ')}"/>`).join('');
  const xlabels = weeks.filter((_,i) => i % Math.ceil(weeks.length/6) === 0)
    .map(wk => `<text x="${X(wk)}" y="${h-4}" font-size="8" fill="var(--sub)" text-anchor="middle">${wk.slice(5)}</text>`).join('');
  const legend = S.map(x => `<span style="font-size:10px;margin-right:12px"><span style="display:inline-block;width:16px;height:3px;background:${x.color};vertical-align:middle;margin-right:4px"></span>${esc(x.name)}</span>`).join('');
  return `<div style="margin-bottom:4px">${legend}</div><svg width="${w}" height="${h}" style="max-width:100%">${grid}${lines}${xlabels}</svg>`;
}
const pct = (a,b) => b ? Math.round((a-b)/b*100) : null;

/* 최근 4주 vs 이전 4주 */
function change4(eid, region){
  const rows = sigOf(eid, region); if(rows.length < 2) return null;
  const last8 = rows.slice(-8);
  const prev = last8.slice(0, Math.max(0, last8.length-4)).reduce((s,x)=>s+ +x.volume, 0);
  const cur  = last8.slice(-4).reduce((s,x)=>s+ +x.volume, 0);
  if(!prev) return null;
  return pct(cur, prev);
}
const chgHtml = v => v == null ? '<span class="fl">—</span>'
  : v > 3 ? `<span class="up">▲ +${v}%</span>` : v < -3 ? `<span class="dn">▼ ${v}%</span>` : `<span class="fl">${v}%</span>`;

function spark(eid, region, w=150, h=34){
  const rows = sigOf(eid, region).slice(-16);
  if(rows.length < 2) return '<span class="fl">—</span>';
  const vs = rows.map(r => +r.volume), mx = Math.max(...vs, 1), mn = Math.min(...vs, 0);
  const pts = vs.map((v,i) => `${(i/(vs.length-1)*w).toFixed(1)},${(h-3-(v-mn)/(mx-mn||1)*(h-6)).toFixed(1)}`).join(' ');
  const up = vs[vs.length-1] >= vs[0];
  return `<svg class="spark" width="${w}" height="${h}"><polyline points="${pts}" fill="none"
    stroke="${up?'#1a7a4a':'#c8451f'}" stroke-width="1.6"/></svg>`;
}

function stageOf(eid){
  const c = change4(eid,'KR') ?? change4(eid,'GL');
  const rows = sigOf(eid);
  if(!rows.length) return 'New';
  if(c != null && c > 10) return 'Rising';
  if(c != null && c < -15) return 'DESCEND';
  return 'New';
}

async function load(){
  const since = new Date(Date.now() - 62*86400e3).toISOString();
  const [e2, s2, c2, ae, tg, dk] = await Promise.all([
    sb.from('entities').select('entity_id,name_kr,name_en,axis,category_l1,brand_fit,notes,proposal,first_seen,pinned,parent_movement,status'),
    sb.from('search_signals').select('*').order('week'),
    sb.from('v_entity_source_count').select('*'),
    sb.from('asset_entities').select('entity_id,role,images(thumb_url,is_celeb,celeb_name,account,category)').limit(1500),
    sb.from('asset_tags').select('tag_value, images!inner(created_at)').gte('images.created_at', since).limit(1000),
    sb.from('documents').select('keywords,created_at').gte('created_at', since).not('keywords','is',null).limit(400)
  ]);
  ENTS = (e2.data||[]).filter(x => x.status !== 'Archived' && x.axis !== 'movement');
  SIG = s2.data || [];
  CNT = Object.fromEntries((c2.data||[]).map(r => [r.entity_id, r.source_count]));
  COVER = {}; window.LOOKS = {}; window.ECAT = {};
  const catVote = {};
  for(const r of (ae.data||[])){
    if(r.images?.category){
      const cv = catVote[r.entity_id] ||= {};
      cv[r.images.category] = (cv[r.images.category]||0) + 1;
    }
    if(!r.images?.thumb_url) continue;
    COVER[r.entity_id] ||= r.images.thumb_url;
    (window.LOOKS[r.entity_id] ||= []).push(r.images);
  }
  for(const [eid2, cv] of Object.entries(catVote))
    window.ECAT[eid2] = Object.entries(cv).sort((a,b)=>b[1]-a[1])[0][0];
  /* 사전에 없는 #태그 — 피드에서만 잡힌 표현. 등록해야 검색량 추적이 시작됩니다 */
  const entNorms = new Set(ENTS.flatMap(e => [norm(e.name_kr), norm(e.name_en||'')]));
  const tagCnt = {};
  const feedTag = t => { const k = norm(t); if(!k || entNorms.has(k)) return;
    (tagCnt[k] ||= { text: String(t).replace(/^#/,'').replace(/_/g,' '), n: 0 }).n++; };
  for(const r of (tg.data||[])) feedTag(r.tag_value);
  for(const r of (dk.data||[])) for(const k of (r.keywords||[])) feedTag(k);
  TAGS = Object.values(tagCnt).sort((a,b)=>b.n-a.n).slice(0, 40);

  const { data:mm } = await sb.from('search_signals').select('week').order('week',{ascending:false}).limit(1);
  const months = [...new Set([month, ...SIG.map(x => x.week.slice(0,7))])].sort().reverse().slice(0,12);
  $('#mSel').innerHTML = months.map(m => `<option ${m===month?'selected':''}>${m}</option>`).join('');
  draw();
}
$('#mSel').onchange = () => { month = $('#mSel').value; draw(); };

/* FEED 기준(연결 1건+) 키워드 중 검색량 상위 5 */
function top5(region, srcOnly){
  return ENTS.filter(e => (CNT[e.entity_id]||0) >= 1)
    .map(e => { const rows = sigOf(e.entity_id, region, srcOnly).filter(r => r.week.slice(0,7) <= month);
      return { e, v: rows.length ? +rows[rows.length-1].volume : -1, c: change4(e.entity_id, region) }; })
    .sort((a,b) => b.v - a.v)
    .slice(0, 5);
}

/* 원문 링크 → 이미지 URL 매핑. 나중에 엑셀로 받은 이미지 URL을 여기 채워 넣으면
   카드 위에 자동으로 사진이 뜸 (키워드별로 다른 이미지를 쓰려면 url 뒤에 '#키워드'를 붙여서 구분) */
const IMAGE_URL_MAP = {
  // 'https://example.com/article': 'https://example.com/photo.jpg',
};
for (const it of [...FASHION_SIG, ...FASHION_SIG_EXTRA, ...LIFESTYLE_SIG]){
  const key = it.keywords?.[0] ? `${it.url}#${it.keywords[0]}` : it.url;
  it.image_url = it.image_url || IMAGE_URL_MAP[key] || IMAGE_URL_MAP[it.url] || null;
}

/* 뉴스레터 소스 = 패션 트렌드 리서치 + 라이프스타일 리서치(라이프스타일 카테고리로 통합) */
const NEWS_SIG = [
  ...FASHION_SIG,
  ...FASHION_SIG_EXTRA,
  ...LIFESTYLE_SIG.map(s => ({ ...s, category: 'lifestyle' })),
];

/* SNS 세부분류 → 카테고리 매핑 (콤마로 여러 개면 첫 번째 기준) */
const SNS_SUBCAT_MAP = { '상의':'top', '아우터':'outer', '바지':'pants', '원피스':'dress',
  '스커트':'pants', '워터웨어':'etc', '언더웨어/홈웨어':'etc' };
function snsCategoriesOf(s){
  return (s.subcat||'').split(',').map(x=>x.trim()).map(x=>SNS_SUBCAT_MAP[x]).filter(Boolean);
}

const CATS = ['outer','top','pants','dress','shoes','bag','acc','etc','lifestyle'];
const REV_CAT_LABEL = Object.fromEntries(Object.entries(CAT_LABEL).map(([k,v]) => [v,k]));

/* admin.html에서 Supabase trend_signals 테이블로 올린 항목들 — 페이지 로드 시 fetch해서 채움 */
let SB_NEWS = [], SB_LIFESTYLE = [], SB_SNS = [];

async function loadTrendSignals(){
  try{
    const { data, error } = await sb.from('trend_signals').select('*').order('created_at', { ascending: false });
    if(error){ console.warn('trend_signals 로드 실패 (테이블이 아직 없을 수 있음):', error.message); return; }
    SB_NEWS = []; SB_LIFESTYLE = []; SB_SNS = [];
    for(const r of (data || [])){
      if(!r.keyword) continue;
      if(r.source_type === 'news'){
        SB_NEWS.push({ url: r.url, note: r.keyword, category: REV_CAT_LABEL[r.category] || r.category || 'etc',
          keywords: [r.keyword], summary: r.note || '', image_url: r.image_url, stage: 'early' });
      } else if(r.source_type === 'lifestyle'){
        SB_LIFESTYLE.push({ url: r.url, note: r.keyword, category: 'lifestyle',
          keywords: [r.keyword], summary: r.note || '', image_url: r.image_url, stage: 'early',
          related: null, related_note: '' });
      } else if(r.source_type === 'sns'){
        SB_SNS.push({ category: REV_CAT_LABEL[r.category] || r.category || 'etc', keyword: r.keyword,
          note: r.note || '', url: r.url, image_url: r.image_url });
      }
    }
    renderStatic();
  }catch(e){ console.warn('trend_signals 로드 실패:', e); }
}
let scatF = 'top';

function drawCatBar(){
  $('#catBar').innerHTML = CATS.map(c =>
    `<button class="${c===scatF?'on':''}" data-c="${c}">${esc(CAT_LABEL[c]||c)}</button>`).join('');
  $('#catBar').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    scatF = b.dataset.c; drawCatBar(); drawNewsGrid(); drawSnsForCat();
  };
}

function normKw(k){ return String(k||'').trim().toLowerCase(); }

/* 뉴스레터: 기사에 태깅된 keywords를 병합·집계 (동일 키워드 기사 여러 건이면 합쳐서 카운트) */
function aggregateNewsKw(items){
  const map = new Map();
  for(const s of items){
    const kws = (s.keywords && s.keywords.length) ? s.keywords : [s.note.slice(0,24)];
    for(const raw of kws){
      const key = normKw(raw);
      if(!map.has(key)) map.set(key, { label: raw, count: 0, items: [] });
      const e = map.get(key); e.count++; e.items.push(s);
    }
  }
  return [...map.values()].sort((a,b) => b.count - a.count);
}

/* SNS: 콘텐츠에 실제로 달린 해시태그를 키워드로 집계 (브랜드명 나열이 아니라 진짜 쓰인 태그 기준).
   홍보성 상투어(광고/협찬 등)는 제외. 해시태그가 없는 콘텐츠는 집계에서 빠지고 별도 카운트 */
const SNS_TAG_STOPWORDS = new Set(['광고','협찬','제작비지원','제품제공','서포터즈','기자단']);
function extractHashtags(content){
  const tags = [...(content||'').matchAll(/#([^\s#]+)/g)].map(m => m[1]);
  return [...new Set(tags)].filter(t => !SNS_TAG_STOPWORDS.has(t));
}
function aggregateSnsKw(items){
  const map = new Map();
  let genericCount = 0;
  for(const s of items){
    const tags = extractHashtags(s.content);
    if(!tags.length){ genericCount++; continue; }
    for(const raw of tags){
      const key = normKw(raw);
      if(!map.has(key)) map.set(key, { label: '#'+raw, count: 0, score: 0, items: [] });
      const e = map.get(key); e.count++; e.score += s.score; if(!e.items.includes(s)) e.items.push(s);
    }
  }
  const ranked = [...map.values()].sort((a,b) => b.score - a.score || b.count - a.count);
  return { ranked, genericCount };
}

function newsExampleHTML(entry){
  const first = entry.items[0];
  const links = entry.items.map((s,i) =>
    `<a class="kwlink" href="${esc(s.url)}" target="_blank" rel="noopener">${entry.items.length>1?`원문${i+1}`:'원문 보기'} →</a>`).join(' ');
  return `<div class="kwex">${esc(first.summary || first.note)}</div>${links}`;
}

function snsExampleHTML(entry){
  const top = [...entry.items].sort((a,b) => b.score - a.score)[0];
  const snippet = top.content.length > 60 ? top.content.slice(0,60)+'…' : top.content;
  return `<div class="kwex">${esc(snippet)}</div><a class="kwlink" href="${esc(top.post_url)}" target="_blank" rel="noopener">대표 게시물 보기 →</a>`;
}

function kwCardHTML(entry, i, exampleFn, showScore, metaOverride, maxVal){
  const meta = metaOverride ? metaOverride(entry) : `${entry.count}건 언급${showScore ? ` · 스코어 ${entry.score.toLocaleString()}` : ''}`;
  const val = showScore ? entry.score : entry.count;
  const pct = maxVal ? Math.max(6, Math.round(val / maxVal * 100)) : 0;
  const img = entry.items.find(it => it.image_url)?.image_url;
  const hot = entry.count > 1;
  return `<div class="kwcard${hot ? ' hot' : ''}">
    ${img ? `<img class="kwphoto" src="${esc(img)}" alt="" loading="lazy">` : ''}
    <div class="kwrank">#${i+1}${hot ? ' 🔥' : ''}</div>
    <div class="kwname">${esc(entry.label)}</div>
    <div class="kwmeta">${meta}</div>
    <div class="volbar"><i style="width:${pct}%"></i></div>
    ${exampleFn(entry)}
  </div>`;
}

function renderKwBlock(gridSel, moreBtnSel, moreListSel, cntSel, ranked, exampleFn, showScore, emptyMsg, bigN=8, metaOverride){
  const maxVal = ranked.length ? Math.max(...ranked.map(e => showScore ? e.score : e.count)) : 0;
  $(gridSel).innerHTML = ranked.length ? ranked.map((e,i)=>kwCardHTML(e,i,exampleFn,showScore,metaOverride,maxVal)).join('') : `<div class="empty">${emptyMsg}</div>`;
  $(cntSel).textContent = ranked.length ? `키워드 ${ranked.length}개 · 언급 많은 순` : '';
  const moreBtn = $(moreBtnSel), moreList = $(moreListSel);
  moreBtn.style.display = 'none';
  moreList.style.display = 'none';
  moreList.innerHTML = '';
}

function drawNewsGrid(){
  const catItems = [...NEWS_SIG, ...SB_NEWS].filter(s => s.category === scatF);
  const ranked = aggregateNewsKw(catItems);
  renderKwBlock('#newsKwGrid','#newsMoreBtn','#newsKwMore','#newsCnt', ranked, newsExampleHTML, false,
    '해당 카테고리의 뉴스레터 시그널이 아직 없습니다');
}

/* Supabase로 올라온 수동 SNS 항목을 해시태그 집계 결과와 합침 */
function aggregateManualSns(items){
  const map = new Map();
  for(const it of items){
    const key = normKw(it.keyword);
    if(!map.has(key)) map.set(key, { label: it.keyword, count: 0, score: 0, items: [] });
    const e = map.get(key); e.count++;
    e.items.push({ content: it.note, score: 0, post_url: it.url, image_url: it.image_url });
  }
  return [...map.values()];
}

function drawSnsForCat(){
  const catItems = SNS_VIRAL.filter(s => snsCategoriesOf(s).includes(scatF));
  const { ranked, genericCount } = aggregateSnsKw(catItems);
  const manual = aggregateManualSns(SB_SNS.filter(s => s.category === scatF));
  const combined = [...manual, ...ranked].sort((a,b) => b.score - a.score || b.count - a.count);
  renderKwBlock('#snsKwGrid','#snsMoreBtn','#snsKwMore','#snsCnt', combined, snsExampleHTML, true,
    '해당 카테고리의 SNS 시그널이 아직 없습니다');
  $('#snsGenericNote').textContent = genericCount
    ? `해시태그가 없는 콘텐츠 ${genericCount}건은 키워드 집계에서 제외했어요`
    : '';
}

/* 라이프스타일 — 비슷한 키워드는 테마로 묶어서 보여줌 (카테고리 필터와 무관하게 항상 전체 표시) */
const LIFESTYLE_THEME_MAP = {
  'social sauna': '웰니스·리커버리',
  'recovery economy': '웰니스·리커버리',
  'jjimjilbang revival': '웰니스·리커버리',
  'hiking boom': '등산 붐',
  'hiking style': '등산 붐',
  'running boom': '러닝 붐',
  'digital declutter': '디지털-아날로그 밸런스',
  'analog maximalism': '디지털-아날로그 밸런스',
  'nature proximity': '자연 지향',
  'me-conomy': '미코노미',
};
function aggregateLifestyleThemes(items){
  const map = new Map();
  for(const it of items){
    const kw = (it.keywords||[])[0] || it.note;
    const theme = LIFESTYLE_THEME_MAP[kw] || kw;
    if(!map.has(theme)) map.set(theme, { label: theme, count: 0, items: [], seenUrls: new Set() });
    const e = map.get(theme);
    if(e.seenUrls.has(it.url)) continue;   /* 같은 기사가 중복 수집된 경우 한 번만 */
    e.seenUrls.add(it.url); e.count++; e.items.push(it);
  }
  return [...map.values()].sort((a,b) => b.count - a.count);
}

function lifeExampleHTML(entry){
  const rows = entry.items.map((s,i) => `
    <div class="kwex" style="margin-bottom:2px">${esc(s.summary || s.note)}</div>
    <a class="kwlink" href="${esc(s.url)}" target="_blank" rel="noopener">${entry.items.length>1?`원문${i+1}`:'원문 보기'} →</a>`).join('<div style="height:6px"></div>');
  const first = entry.items[0];
  const rel = first.related
    ? `<button class="relbadge" data-c="${esc(first.related)}">→ ${esc(CAT_LABEL[first.related]||first.related)} 트렌드로 이어짐 — ${esc(first.related_note||'')}</button>`
    : '';
  return `${rows}${rel}`;
}

function drawLifeBlock(){
  const ranked = aggregateLifestyleThemes([...LIFESTYLE_SIG, ...SB_LIFESTYLE]);
  renderKwBlock('#lifeKwGrid','#lifeMoreBtn','#lifeKwMore','#lifeCnt', ranked, lifeExampleHTML, false,

}
