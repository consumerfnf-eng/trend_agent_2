/* ranked 리스트를 개별 카드들로 펼침. 각 entry의 items 안 원문들을 각각 카드 하나씩 */
function flatCardsHTML(ranked){
  const cards = [];
  for(const entry of ranked){
    for(const it of (entry.items || [])){
      cards.push({ entry, it, ym: it.ym || '' });
    }
  }
  /* 최신 발행월 순으로 정렬, 없으면 뒤로 */
  cards.sort((a,b) => (b.ym || '0').localeCompare(a.ym || '0'));
  return cards.map(({entry, it}) => itemCardHTML(entry, it)).join('');
}

/* 카드(박스)를 누르면 펼쳐서 숨은 사진·전체 설명을 보여준다.
   링크·태그·연결 배지 등에서 시작한 클릭은 각자 동작하도록 제외한다. */
document.addEventListener('click', e => {
  if(e.target.closest('a, button, .tagrow, .tagchip, .relbadge, .kwmoreimgs')) return;
  const card = e.target.closest('.kwcard.has-more'); if(!card) return;
  card.classList.toggle('expanded');
});

/* 언급 건수 기준 버블 요약 — 카드 위에 표시, 카테고리/섹션이 바뀔 때마다 새로 계산됨(정적 아님).
   1건 언급은 "겹침"이 아니라서 버블에서는 제외하고, 카드 목록에는 그대로 나옴 */
/* 섹션별 버블 보기 모드 — 'kw'(키워드) 또는 'tag'(해시태그) */
const BUBBLE_MODE = {};
/* 해시태그 버블은 태그 필터를 걸어도 목록이 줄지 않도록,
   월 필터만 적용한 데이터로 따로 계산한다 */
const TAG_POOL = {};

/* 그 섹션의 카드들을 대표 키워드(클러스터) 기준으로 집계.
   카드 하나가 여러 클러스터에 매칭될 수 있음(예: y2k+retro-runner → retro 클러스터 1건).
   같은 카드는 같은 클러스터에 중복 카운트하지 않음. */
function aggregateClusters(ranked){
  const clusters = new Map();
  /* 대표+유사 태그 전체 세트를 대표별로 미리 만들어 둠 */
  const memberSet = {};
  for(const [head, arr] of Object.entries(CLUSTERS)){
    memberSet[head] = new Set([head, ...arr]);
  }
  for(const e of ranked){
    for(const it of (e.items || [])){
      const tags = it.tags || [];
      if(!tags.length) continue;
      /* 이 카드가 매칭되는 대표 키워드들 */
      const matched = new Set();
      for(const [head, mset] of Object.entries(memberSet)){
        for(const t of tags){ if(mset.has(t)){ matched.add(head); break; } }
      }
      /* 클러스터에 안 걸리는 태그(고아 태그)는 자기 자신을 대표로 취급 */
      for(const t of tags){ if(!(t in TAG_TO_HEAD) && !(t in CLUSTERS)){ matched.add(t); } }
      for(const t of tags){ if(t in CLUSTERS){ matched.add(t); } }
      for(const head of matched){
        if(!clusters.has(head)){
          clusters.set(head, { label: head, count: 0, items: [], authors: new Set(), members: new Set() });
        }
        const v = clusters.get(head);
        v.count++;
        v.items.push(it);
        if(it.author) v.authors.add(it.author);
        for(const t of tags){ v.members.add(t); }
      }
    }
  }
  return [...clusters.values()].sort((a,b) => b.count - a.count || a.label.localeCompare(b.label));
}

/* 클러스터 버블 — 크기=카드 수, 🔥는 카드 많은 순 상위에 크기 비례로.
   각 버블에 "더보기" 버튼이 붙어서 클릭하면 상세 모달이 열림. */
/* ═══ 해시태그 타임라인 ═══
   가로만 년월이고 세로에는 의미가 없다. 원 크기와 진하기가 언급량을 나타내고,
   원끼리 겹치지 않도록 밀어내되 줄을 맞추지 않아 자연스럽게 흩어지게 한다. */

/* ── 파스텔 팔레트 (태그별 고정 색) ───────────────────────── */
const TAG_PASTEL = ['#BFE3D6','#FBD5CE','#CFE6F2','#E6DAF3','#FBECBB','#F8D9E4','#D3EAC2','#DAE3F2','#FBE0C8','#CDECE6','#EAD9C6','#D9E9CE'];
const BUBBLE_HUE = '#8FB6D9';   /* 해시태그 버블 단일 파스텔 색(진하기는 언급량으로) */
function tagHue(name){ let h = 0; for(let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0; return TAG_PASTEL[h % TAG_PASTEL.length]; }

/* 선택 기간의 월 목록(YYYY-MM) */
function tagMonthAxis(fallbackYms){
  const months = [];
  const [ys, ms] = String(monthStart || '').split('-').map(Number);
  const [ye, me] = String(monthEnd || '').split('-').map(Number);
  if(ys && ye){
    let y = ys, m = ms;
    for(let g = 0; g < 60; g++){ months.push(`${y}-${String(m).padStart(2, '0')}`); if(y === ye && m === me) break; m++; if(m > 12){ m = 1; y++; } }
  }
  if(!months.length) months.push(...[...new Set(fallbackYms)].sort());
  return months;
}
function tagCellAgg(ranked){
  const cell = new Map();
  for(const e of ranked) for(const it of (e.items || [])){
    const ym = it.ym; if(!ym) continue;
    for(const t of (it.tags || [])){
      const key = t + '|' + ym;
      if(!cell.has(key)) cell.set(key, { tag: t, ym, count: 0 });
      cell.get(key).count++;
    }
  }
  return [...cell.values()];
}

/* ── 기본 해시태그 버블: 가로=년월, 크기·글씨=언급량, 파스텔, 라벨 한 줄(안 잘림) ── */
function tagScatterHTML(ranked, gridSel){
  /* 기간 전체 태그별 합계 → 한 덩어리로 뭉치기(년월 축 없음, 큰 원 가운데) */
  const pts0 = tagCellAgg(ranked);
  if(!pts0.length) return '<div class="empty" style="padding:10px 0">이 섹션에는 아직 해시태그가 없습니다</div>';
  const months = tagMonthAxis(pts0.map(p => p.ym));
  const mIdx = new Map(months.map((m, i) => [m, i]));
  const totals = new Map();
  for(const p of pts0){ if(!mIdx.has(p.ym)) continue; totals.set(p.tag, (totals.get(p.tag) || 0) + p.count); }
  let arr = [...totals.entries()].map(([tag, count]) => ({ tag, count }));
  if(!arr.length) return '<div class="empty" style="padding:10px 0">이 기간에는 해시태그가 없습니다</div>';
  arr.sort((a, b) => b.count - a.count || a.tag.localeCompare(b.tag));
  const TOPN = 40;
  const totalTags = arr.length;
  arr = arr.slice(0, TOPN);
  const maxC = Math.max(...arr.map(a => a.count), 1);

  const rMin = 20, rMax = 78;
  const rOf = c => rMin + (rMax - rMin) * Math.sqrt(c / maxC);
  const nodes = arr.map(a => ({ p: a, r: rOf(a.count), x: 0, y: 0 }));
  nodes.sort((a, b) => b.r - a.r);
  /* 큰 것부터 중앙 근처, 초기엔 원형으로 흩뿌림 */
  nodes.forEach((n, i) => { const ang = i * 2.399963; const rad = 6 + i * 6; n.x = Math.cos(ang) * rad; n.y = Math.sin(ang) * rad; });
  if(nodes.length) { nodes[0].x = 0; nodes[0].y = 0; }
  for(let step = 0; step < 700; step++){
    const g = step < 560 ? 0.97 : 1;        /* 중심으로 끌어당김 */
    for(const n of nodes){ n.x *= g; n.y *= g; }
    for(let i = 0; i < nodes.length; i++){
      for(let j = i + 1; j < nodes.length; j++){
        const a = nodes[i], b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), need = a.r + b.r + 3;
        if(d >= need) continue;
        if(d < 0.01){ dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = Math.hypot(dx, dy) || 1; }
        const push = (need - d) / 2 + 0.1;
        a.x -= dx / d * push; a.y -= dy / d * push;
        b.x += dx / d * push; b.y += dy / d * push;
      }
    }
  }
  /* 경계 계산 → viewBox */
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  for(const n of nodes){ minX = Math.min(minX, n.x - n.r); maxX = Math.max(maxX, n.x + n.r); minY = Math.min(minY, n.y - n.r); maxY = Math.max(maxY, n.y + n.r); }
  const pad = 14;
  const VW = (maxX - minX) + pad * 2, VH = (maxY - minY) + pad * 2;
  const ox = -minX + pad, oy = -minY + pad;

  let svg = `<svg viewBox="0 0 ${VW.toFixed(1)} ${VH.toFixed(1)}" preserveAspectRatio="xMidYMid meet" style="display:block; width:100%; height:auto; max-height:76vh; margin:0 auto" role="img">`;
  for(const n of [...nodes].sort((a, b) => b.r - a.r)){
    const on = tagFilter === n.p.tag;
    const cx = n.x + ox, cy = n.y + oy;
    const op = on ? 1 : (0.45 + 0.55 * (n.p.count / maxC));
    const name = '#' + n.p.tag;
    const availW = 2 * n.r * 0.86;
    const fs = Math.max(Math.min(availW / (name.length * 0.56), n.r * 0.66, 20), 5);
    const tcol = on ? '#ffffff' : '#33404a', ccol = on ? '#ffe4d8' : '#5c6771';
    svg += `<g class="scg" style="transform-box:fill-box; transform-origin:center">
      <circle class="sc" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${n.r.toFixed(1)}"
        fill="${on ? '#c8451f' : tagHue(n.p.tag)}" fill-opacity="${op.toFixed(2)}" stroke="${on ? '#c8451f' : '#ffffff'}" stroke-width="${on ? 3 : 1.5}"
        data-tagbubble="${esc(n.p.tag)}" data-target="${gridSel}" style="cursor:pointer"><title>#${esc(n.p.tag)} · 기간 합계 ${n.p.count}건</title></circle>
      <text x="${cx.toFixed(1)}" y="${(cy - fs * 0.16).toFixed(1)}" font-size="${fs.toFixed(1)}" font-weight="800" fill="${tcol}" text-anchor="middle" pointer-events="none">${esc(name)}</text>
      <text x="${cx.toFixed(1)}" y="${(cy + fs * 0.9).toFixed(1)}" font-size="${(fs * 0.72).toFixed(1)}" font-weight="700" fill="${ccol}" text-anchor="middle" pointer-events="none">${n.p.count}건</text>
    </g>`;
  }
  svg += '</svg>';
  return `<div class="scatterWrap">
    <div class="scatterTop"><span class="mini">기간 전체 · 많이 언급될수록 큰 버블(가운데) · 누르면 그 태그 카드만</span></div>
    ${svg}
    <div class="mini" style="margin-top:4px">${totalTags > nodes.length ? `언급량 상위 ${nodes.length}개 표시 (전체 ${totalTags})` : ''}</div>
  </div>`;
}

function tagFlowHTML(ranked, gridSel){
  /* 년월 가로축 · 태그마다 한 줄 · 달마다 점(크기=그 달 건수) · 점들을 선으로 이음 */
  const pts0 = tagCellAgg(ranked);
  if(!pts0.length) return '<div class="empty" style="padding:10px 0">이 섹션에는 아직 해시태그가 없습니다</div>';
  const months = tagMonthAxis(pts0.map(p => p.ym));
  const mIdx = new Map(months.map((m, i) => [m, i]));
  const pts = pts0.filter(p => mIdx.has(p.ym));

  const tagMap = new Map();
  for(const p of pts){
    if(!tagMap.has(p.tag)) tagMap.set(p.tag, { tag: p.tag, total: 0, byIdx: new Map() });
    const e = tagMap.get(p.tag); e.total += p.count; e.byIdx.set(mIdx.get(p.ym), (e.byIdx.get(mIdx.get(p.ym)) || 0) + p.count);
  }
  const qualified = [...tagMap.values()]
    .filter(t => t.byIdx.size >= 2)                 /* 2개 이상의 달에 나온 키워드만 */
    .sort((a, b) => b.total - a.total || a.tag.localeCompare(b.tag))
    .slice(0, FLOW_TOPN);

  const topnSel = `<label class="flowTopn">상위
    <select data-flowtopn>${[5,7,10,15].map(v => `<option value="${v}"${v===FLOW_TOPN?' selected':''}>${v}</option>`).join('')}</select>개</label>`;

  if(!qualified.length){
    return `<div class="scatterWrap"><div class="scatterTop"><span class="mini">여러 달(2개 이상)에 걸쳐 언급된 키워드</span>${topnSel}</div>
      <div class="empty" style="padding:16px 0">이 기간에 2개 달 이상 나온 키워드가 없어요. (기간을 넓히거나 여러 달 자료가 있는 카테고리에서 확인해 보세요)</div></div>`;
  }

  const maxC = Math.max(...qualified.flatMap(t => [...t.byIdx.values()]), 1);
  const gutterL = 150, padR = 26, padT = 30, padB = 30, rowH = 46, W = 1120;
  const plotW = W - gutterL - padR, colW = plotW / months.length;
  const xAt = i => gutterL + colW * (i + 0.5);
  const rowY = k => padT + rowH * (k + 0.5);
  const rMax = Math.min(rowH * 0.42, colW * 0.4, 20), rMin = 6;
  const rOf = c => rMin + (rMax - rMin) * Math.sqrt(c / maxC);
  const H = padT + rowH * qualified.length + padB;

  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="display:block; width:100%; height:auto; margin:0 auto" role="img">`;
  /* 세로 월 가이드 + 헤더 */
  months.forEach((m, i) => {
    const x0 = gutterL + colW * i;
    svg += `<line x1="${x0.toFixed(1)}" y1="${padT}" x2="${x0.toFixed(1)}" y2="${(padT + rowH * qualified.length).toFixed(1)}" stroke="#f2ede4" stroke-width="1"/>`;
    svg += `<text x="${xAt(i).toFixed(1)}" y="${(padT - 12).toFixed(1)}" font-size="12.5" font-weight="700" fill="#8a8578" text-anchor="middle">${esc(m)}</text>`;
  });
  svg += `<line x1="${gutterL}" y1="${padT}" x2="${gutterL}" y2="${(padT + rowH * qualified.length).toFixed(1)}" stroke="#e4ded2" stroke-width="1"/>`;

  qualified.forEach((t, k) => {
    const y = rowY(k), on = tagFilter === t.tag, hue = tagHue(t.tag);
    if(k % 2 === 1) svg += `<rect x="${gutterL}" y="${(padT + rowH * k).toFixed(1)}" width="${plotW.toFixed(1)}" height="${rowH}" fill="#faf7f2"/>`;
    if(on) svg += `<rect x="0" y="${(padT + rowH * k).toFixed(1)}" width="${W}" height="${rowH}" fill="#fbeee7"/>`;
    /* 왼쪽 라벨(한 줄) + 총 건수 */
    svg += `<text x="${(gutterL - 12).toFixed(1)}" y="${(y - 2).toFixed(1)}" font-size="12.5" font-weight="${on ? 800 : 700}" fill="${on ? '#c8451f' : '#3a4048'}" text-anchor="end">#${esc(t.tag)}</text>`;
    svg += `<text x="${(gutterL - 12).toFixed(1)}" y="${(y + 12).toFixed(1)}" font-size="9.5" font-weight="600" fill="#9a938a" text-anchor="end">총 ${t.total}건</text>`;
    /* 점 좌표(월 순) */
    const dots = months.map((m, i) => ({ i, x: xAt(i), c: t.byIdx.get(i) || 0 })).filter(d => d.c > 0);
    /* 선으로 잇기(점들을 월 순서대로) */
    if(dots.length >= 2){
      const pline = dots.map(d => `${d.x.toFixed(1)},${y.toFixed(1)}`).join(' ');
      svg += `<polyline points="${pline}" fill="none" stroke="${on ? '#c8451f' : hue}" stroke-width="${on ? 4 : 3}" stroke-opacity="${on ? 0.9 : 0.7}" stroke-linecap="round"/>`;
    }
    /* 점(원) — 크기=그 달 건수, 건수 표시 */
    for(const d of dots){
      const r = rOf(d.c);
      svg += `<g class="scg" style="transform-box:fill-box; transform-origin:center">
        <circle class="sc" cx="${d.x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}"
          fill="${on ? '#c8451f' : hue}" fill-opacity="${on ? 1 : 0.92}" stroke="#ffffff" stroke-width="1.5"
          data-tagbubble="${esc(t.tag)}" data-target="${gridSel}" style="cursor:pointer"><title>#${esc(t.tag)} · ${esc(months[d.i])} · ${d.c}건</title></circle>`;
      if(r >= 9) svg += `<text x="${d.x.toFixed(1)}" y="${(y + 3.2).toFixed(1)}" font-size="10" font-weight="800" fill="#fff" text-anchor="middle" pointer-events="none">${d.c}</text>`;
      svg += `</g>`;
    }
  });
  svg += '</svg>';

  return `<div class="scatterWrap">
    <div class="scatterTop"><span class="mini">가로 년월 · 태그마다 한 줄 · 점 크기=그 달 건수 · 선으로 흐름 표시 · 많이 언급된 순</span>${topnSel}</div>
    ${svg}
    <div class="mini" style="margin-top:4px">점을 누르면 그 태그 카드만 볼 수 있어요 · 상위 ${qualified.length}개</div>
  </div>`;
}


function tagBubbleHTML(ranked, gridSel){
  const clusters = aggregateClusters(ranked).slice(0, 14);
  if(!clusters.length) return '<div class="empty" style="padding:10px 0">이 섹션에는 아직 해시태그가 없습니다</div>';
  const maxVal = Math.max(...clusters.map(c => c.count), 1);
  const minD = 44, maxD = 156;
  return clusters.map((c, i) => {
    const d = Math.round(minD + (maxD-minD) * (c.count / maxVal));
    const on = tagFilter === c.label;
    /* 🔥 크기: 카드 수 비율로 3단계 */
    const ratio = c.count / maxVal;
    const fireSize = ratio >= 0.85 ? 16 : ratio >= 0.55 ? 13 : ratio >= 0.3 ? 11 : 0;
    const showFire = i < 3 && fireSize > 0 && c.count >= 2;
    /* 흑백 그라데이션 */
    const shade = Math.max(0.06, Math.pow(ratio, 1.6));
    const lightness = Math.round(96 - shade * 88);
    const textIsWhite = lightness < 55;
    const bg = `hsl(30, 4%, ${lightness}%)`;
    const bd = `hsl(30, 4%, ${Math.max(lightness - 8, 8)}%)`;
    const txC = textIsWhite ? '#fff' : 'var(--tx)';
    const sbC = textIsWhite ? 'rgba(255,255,255,.75)' : 'var(--sub)';
    /* 폰트 크기를 원 지름 + 글자 수 둘 다 반영해서 한 줄에 다 들어가게.
       #포함한 글자 수 기준, 원 내부 유효 폭(대략 지름의 85%)에 맞춤. */
    const label = '#' + c.label;
    const innerW = d * 0.86;                                /* 원 안쪽 실제 가용 폭 */
    const charW = 0.58;                                     /* 대문자·소문자 평균 폭 계수 (실측 기준) */
    const maxByW = innerW / (label.length * charW);         /* 한 줄에 다 들어가는 최대 폰트 크기 */
    const maxByD = d >= 100 ? 16 : d >= 72 ? 14 : d >= 55 ? 12 : 10.5;
    const nameSize = Math.max(8.5, Math.min(maxByW, maxByD));
    const countSize = Math.max(8, nameSize - 3);
    return `<div class="bubble${on ? ' on' : ''}" style="width:${d}px; height:${d}px; background:${bg}; border-color:${bd}"
      data-tagbubble="${esc(c.label)}" data-target="${gridSel}" title="${c.count}건 (매칭 태그 ${c.members.size}종)">
      ${showFire ? `<span class="fire" style="font-size:${fireSize}px" title="카드가 많은 클러스터">🔥</span>` : ''}
      <span class="bn" style="font-size:${nameSize.toFixed(1)}px; color:${txC}; white-space:nowrap">${esc(label)}</span>
      <span class="bc" style="font-size:${countSize.toFixed(1)}px; color:${sbC}">${c.count}건</span>
      <button class="bubbleMore" data-cluster="${esc(c.label)}" title="${esc(c.label)} 상세 보기">⋯</button>
    </div>`;
  }).join('');
}

function bubbleHTML(ranked, gridSel, catCtx){
  /* 버블에는 그 섹션의 키워드를 모두 표시한다.
     크기·순서는 언급량 순, 🔥는 서로 다른 작성자 2명 이상이 같은 키워드를 올렸을 때만 */
  const top = ranked.slice(0, 14);
  if(!top.length) return '';
  const maxVal = Math.max(...top.map(e => e.count), 1);
  const minD = 40, maxD = 152;
  return top.map((e,i) => {
    const d = Math.round(minD + (maxD-minD) * (e.count / maxVal));
    const multiAuthor = authorCount(e.items) >= 2;
    const hasFwd = catCtx === 'lifestyle' && LIFESTYLE_LINKS.some(l => normKw(l.life) === normKw(e.label));
    const hasRev = catCtx && catCtx !== 'lifestyle'
      && LIFESTYLE_LINKS.some(l => l.cat === catCtx && normKw(l.kw) === normKw(e.label));
    const linked = hasFwd || hasRev;
    /* 흑백 그라데이션 */
    const ratio = e.count / maxVal;
    const shade = Math.max(0.06, Math.pow(ratio, 1.6));
    const lightness = Math.round(96 - shade * 88);
    const textIsWhite = lightness < 55;
    const bg = `hsl(30, 4%, ${lightness}%)`;
    const bd = `hsl(30, 4%, ${Math.max(lightness - 8, 8)}%)`;
    const txC = textIsWhite ? '#fff' : 'var(--tx)';
    const sbC = textIsWhite ? 'rgba(255,255,255,.75)' : 'var(--sub)';
    /* 폰트 크기 자동 — 태그명 길이 반영해서 한 줄에 다 들어가도록 (한글은 좀 넓으니 계수 다르게) */
    const label = String(e.label || '');
    const hasKorean = /[가-힣]/.test(label);
    const charW = hasKorean ? 0.95 : 0.58;
    const innerW = d * 0.86;
    const maxByW = innerW / (Math.max(label.length, 1) * charW);
    const maxByD = d >= 100 ? 16 : d >= 72 ? 14 : d >= 55 ? 12 : 10.5;
    const nameSize = Math.max(8.5, Math.min(maxByW, maxByD));
    const countSize = Math.max(8, nameSize - 3);
    return `<div class="bubble" style="width:${d}px; height:${d}px; background:${bg}; border-color:${bd}" data-kw="${esc(e.label)}" data-target="${gridSel}">
      ${linked ? '<span class="linkdot" title="다른 카테고리와 연결됨">🔗</span>' : ''}
      ${multiAuthor ? '<span class="fire" title="여러 사람이 같은 키워드를 등록했습니다">🔥</span>' : ''}
      <span class="bn" style="font-size:${nameSize.toFixed(1)}px; color:${txC}; white-space:nowrap">${esc(label)}</span>
      <span class="bc" style="font-size:${countSize.toFixed(1)}px; color:${sbC}">${e.count}건</span>
    </div>`;
  }).join('');
}

/* 제목 문자열을 토큰 배열로 — 대괄호 안 제거 + 한글 2자↑ 또는 영문 3자↑ */
function _reportTokenize(title){
  let t = String(title || '');
  t = t.replace(/\[[^\]]*\]/g, ' ');   /* [27SS Runway Trend] 같은 대괄호 제거 */
  /* 'OO 코어'처럼 띄어 쓴 접미어는 한 단어로 붙임 — 슬래커 코어 → 슬래커코어 */
  t = t.replace(/([가-힣A-Za-z0-9]+)\s+(코어|코렉스|맥싱|룩|무드|웨어)\b/g, '$1$2');
  const tokens = t.match(/[가-힣]{2,}|[A-Za-z][A-Za-z0-9-]{2,}/g) || [];
  return tokens.map(x => x.toLowerCase());
}

/* 한국어 조사 떼어내기 — '플립플롭이나' '플립플롭은' 을 '플립플롭' 으로 맞춤

   1순위: 이미 등록된 키워드/별칭 중 하나로 시작하면 그 단어로 자름
          (가장 안전 — 실제 쓰는 말이 기준)
   2순위: 흔한 조사 목록으로 자르되, 남는 글자가 3자 이상일 때만
          ('사우나'의 '나', '레트로'의 '로' 처럼 어미를 잘라먹지 않도록) */
const _KO_PARTICLES = ['이라는','라는','이나','으로','에서','에게','까지','부터','처럼','보다',
                       '마다','조차','밖에','하고','이며','이고','과의','와의',
                       '은','는','이','가','을','를','의','에','도','와','과','로'];

/* 실제로 쓰이는 말 목록 — 카드 키워드 + 별칭 사전에서 모음 */
function _knownTerms(){
  const set = new Set();
  const add = v => { const t = String(v || '').trim(); if(t.length >= 2) set.add(t.toLowerCase()); };
  for(const s of [...SB_NEWS, ...SB_LIFESTYLE, ...SB_SNS]){
    add((s.keywords && s.keywords[0]) || s.keyword);
  }
  try{ for(const k of Object.keys(ALIAS_MAP)) add(k); }catch(e){}
  try{ for(const v of Object.values(ALIAS_MAP)) add(v); }catch(e){}
  return set;
}
let _KNOWN_CACHE = null;

function _stripKoParticle(w){
  const raw = String(w || '');
  if(!/^[가-힣]+$/.test(raw)) return raw;          /* 한글 토큰에만 적용 */

  /* 1순위 — 등록된 말로 시작하면 거기까지만 */
  if(!_KNOWN_CACHE) _KNOWN_CACHE = _knownTerms();
  let best = '';
  for(const t of _KNOWN_CACHE){
    if(t.length >= 2 && t.length < raw.length && raw.startsWith(t) && t.length > best.length) best = t;
  }
  if(best) return best;

  /* 2순위 — 흔한 조사 (남는 글자 3자 이상일 때만) */
  for(const p of _KO_PARTICLES){
    if(raw.endsWith(p) && raw.length - p.length >= 3) return raw.slice(0, raw.length - p.length);
  }
  return raw;
}

/* 두 토큰을 "유사 표기 통합" 기준으로 같다고 볼지
   — 조사 제거 + 공백/하이픈/대소문자 무시 + keyword_aliases의 영한 표기 통합 */
function _reportNorm(raw0){
  const w = _stripKoParticle(raw0);
  const base = String(w || '').toLowerCase().replace(/[\s\-_]+/g, '');
  try{
    const canon = ALIAS_MAP[normKw(w)];
    if(canon) return String(canon).toLowerCase().replace(/[\s\-_]+/g, '');
  }catch(e){}
  return base;
}

/* items: 이 카테고리의 카드 배열. 각 원문마다 { note(제목), summary, ym, url, source, image_url } 있는 형태.
   반환: [{ word, count, items[] }] — count>=3인 것만, 카운트 많은 순 */
function detectRepeatedTitleTrends(items){
  const groups = new Map();   /* normKey → { word, items:[], titles:[] } */
  for(const it of items){
    const raw = it.note || it.keyword || (it.keywords && it.keywords[0]) || '';
    const tokens = _reportTokenize(raw);
    /* 카드당 같은 단어를 중복 카운트 안 하도록 Set */
    const seenInCard = new Set();
    for(const w of tokens){
      const key = _reportNorm(w);
      if(!key || key.length < 2) continue;
      if(REPORT_STOPWORDS.has(w) || REPORT_STOPWORDS.has(key)) continue;
      if(REPORT_BRAND_SET.has(w) || REPORT_BRAND_SET.has(key)) continue;
      if(seenInCard.has(key)) continue;
      seenInCard.add(key);
      const shown = _stripKoParticle(w);   /* 화면에 보일 단어도 조사를 뗀 형태로 */
      if(!groups.has(key)) groups.set(key, { word: shown, items: [], _normKey: key });
      const g = groups.get(key);
      /* 표시용 단어는 더 짧고 깔끔한 쪽을 대표로 (조사가 덜 붙은 형태) */
      if(shown.length < g.word.length) g.word = shown;
      g.items.push(it);
    }
  }
  const out = [...groups.values()]
    .filter(g => g.items.length >= 3)
    .map(g => ({
      word: g.word,
      count: g.items.length,
      /* 최신순 정렬 — 대표 이미지는 최신 카드에서 뽑을 것 */
      items: g.items.slice().sort((a, b) => (b.ym || '0').localeCompare(a.ym || '0'))
    }))
    .sort((a, b) => b.count - a.count || a.word.localeCompare(b.word));
  return out;
}

/* 리포트 섹션 HTML — 카테고리 위 상단에 반복 단어별로 카드형 리포트 */
function repeatedTrendsReportHTML(items){
  const trends = detectRepeatedTitleTrends(items);
  if(!trends.length) return '';
  const blocks = trends.map((t, i) => {
    const top = t.items[0];
    const img = top && top.image_url;
    /* 이 유행어가 나온 카드들의 해시태그 — 누르면 그 태그로 걸러 봄 */
    const tagCount = new Map();
    for(const it of t.items)
      for(const tg of (it.tags || [])) tagCount.set(tg, (tagCount.get(tg) || 0) + 1);
    const tags = [...tagCount.entries()]
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
      .slice(0, 10)
      .map(x => x[0]);
    const kwChips = tags.length
      ? `<div class="repKws">${tags.map(tg =>
          `<button class="repKw${tagFilter === tg ? ' on' : ''}" data-reptag="${esc(tg)}">#${esc(tg)}</button>`).join('')}</div>`
      : '';
    const bullets = t.items.map(it => {
      const src = it.source || '';
      const sum = it.summary || it.note || '';
      const line = sum.length > 160 ? sum.slice(0, 160) + '…' : sum;
      const link = it.url
        ? `<a class="repLink" href="${esc(it.url)}" target="_blank" rel="noopener">원문 →</a>`
        : '';
      return `<li>
        <span class="repSrc">${esc(src) || '출처 미상'}</span>
        <span class="repText">${esc(line)}</span>
        ${link}
      </li>`;
    }).join('');
    return `<div class="repBlock">
      <div class="repBadge">유행 중 · ${t.count}건 반복</div>
      <div class="repTitleBar"><span class="repNum">${i + 1}</span><span class="repTitle">${esc(t.word)}</span></div>
      ${kwChips}
      <div class="repBody">
        ${img
          ? `<div class="repImg"><img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)"></div>`
          : ''}
        <ul class="repList">${bullets}</ul>
      </div>
    </div>`;
  }).join('');
  return `<div class="repWrap">
    <div class="repHead">HOT TREND KEYWORD
      <span class="repSub">제목에 3번 이상 반복된 단어 기준 · 자동 감지</span>
    </div>
    ${blocks}
  </div>`;
}

/* 리포트를 카드 그리드 "위"에 가로로 놓기 위한 전용 상자.
   그리드 안에 넣으면 카드 한 칸처럼 좁아지므로 형제 요소로 만든다. */
function reportBoxFor(gridSel){
  const grid = $(gridSel);
  if(!grid || !grid.parentElement) return null;
  let box = grid.parentElement.querySelector(`[data-report-for="${gridSel}"]`);
  if(!box){
    box = document.createElement('div');
    box.setAttribute('data-report-for', gridSel);
    grid.parentElement.insertBefore(box, grid);
  }
  return box;
}

function renderKwBlock(gridSel, moreBtnSel, moreListSel, cntSel, ranked, exampleFn, showScore, emptyMsg, bigN=8, metaOverride, bubbleSel, catCtx){
  /* 반복 단어 리포트 — 키워드 탭에서만 표시. 해시태그 탭에서는 카드만 보여준다 */
  const bubbleMode = bubbleSel ? (BUBBLE_MODE[bubbleSel] || 'kw') : 'kw';
  const box = reportBoxFor(gridSel);
  if(box){
    const allItems = ranked.flatMap(e => e.items || []);
    box.innerHTML = bubbleMode === 'kw' ? (repeatedTrendsReportHTML(allItems) || '') : '';
  }
  $(gridSel).innerHTML = ranked.length ? flatCardsHTML(ranked) : `<div class="empty">${emptyMsg}</div>`;
  const totalCards = ranked.reduce((n,e) => n + (e.items || []).length, 0);
  $(cntSel).textContent = totalCards ? `${totalCards}건 · 최신 순` : '';
  if(bubbleSel){
    const mode = BUBBLE_MODE[bubbleSel] || 'kw';
    const flow = !!FLOW_MODE[bubbleSel];
    const tabs = `<div class="bubbleTabs" data-bubble="${bubbleSel}">
      <button data-mode="kw"${mode==='kw'?' class="on"':''}>키워드</button>
      <button data-mode="tag"${mode==='tag'?' class="on"':''}>해시태그</button>
      <button class="aliasManageBtn" data-openaliases title="유사 해시태그를 대표어로 묶어 관리합니다">⚙ 대표어 관리</button>
      ${mode==='tag' ? `<button class="flowToggle${flow?' on':''}" data-flowtoggle="${bubbleSel}" title="2개월 이상 이어진 키워드를 흐름으로 보기">${flow ? '◱ 버블 보기' : '📈 흐름 보기'}</button>` : ''}
    </div>`;
    /* 키워드 탭에서는 버블 대신 위쪽 HOT TREND KEYWORD 리포트가 그 역할을 하므로 버블은 그리지 않는다.
       해시태그 탭에서는 태그 버블(기본) 또는 흐름 보기(레인)를 표시한다. */
    const pool = TAG_POOL[bubbleSel] || ranked;
    const body = mode === 'tag' ? (flow ? tagFlowHTML(pool, gridSel) : tagScatterHTML(pool, gridSel)) : '';
    $(bubbleSel).innerHTML = tabs + `<div class="bubbleRow">${body}</div>`;
  }
  const moreBtn = $(moreBtnSel), moreList = $(moreListSel);
  moreBtn.style.display = 'none';
  moreList.style.display = 'none';
  moreList.innerHTML = '';
}

/* SNS 사진(행)의 태그를 버블 집계용 항목으로 만든다 — 기사 태그와 같은 풀에 합쳐 개수에 반영 */
function snsTagEntry(pred){
  const items = SB_SNS.filter(pred).filter(s => (s.tags || []).length)
    .map(s => ({ tags: s.tags, ym: s.ym, category: 'SNS' }));
  return items.length ? [{ items }] : [];
}

function drawNewsGrid(){
  const catItems = [...NEWS_SIG, ...SB_NEWS].filter(s => s.category === scatF && visible(s));
  const ranked = aggregateNewsKw(catItems);
  TAG_POOL['#newsBubble'] = [
    ...aggregateNewsKw([...NEWS_SIG, ...SB_NEWS].filter(s => s.category === scatF && inMonth(s))),
    ...snsTagEntry(s => s.category === scatF && inMonth(s)),
  ];
  renderKwBlock('#newsKwGrid','#newsMoreBtn','#newsKwMore','#newsCnt', ranked, newsExampleHTML, false,
    '해당 카테고리의 뉴스레터 시그널이 아직 없습니다', 8, undefined, '#newsBubble', scatF);
}

/* Supabase로 올라온 수동 SNS 항목을 해시태그 집계 결과와 합침 */
function aggregateManualSns(items){
  const map = new Map();
  for(const it of dedupeItems(items)){
    const label = canonKw(it.keyword);
    const key = normKw(label);
    if(!map.has(key)) map.set(key, { label, count: 0, score: 0, items: [] });
    const e = map.get(key); e.count++;
    e.items.push({ content: it.note, score: 0, post_url: it.url, image_url: it.image_url,
      source: it.source, region: it.region, author: it.author });
  }
  return [...map.values()];
}

/* 한 게시물(행)에 여러 장이 담긴 경우(image_url + extra_images)를 사진 단위로 펼친다.
   대표 사진과 나머지가 같은 계정·링크·순서를 공유하도록 복제한다. */
function expandShots(rows){
  const out = [];
  for(const it of rows){
    out.push({ image_url: it.image_url, url: it.url, account: it.account, sub_group: it.sub_group,
      ym: it.ym, region: it.region, source: it.source, tags: it.tags, photo_order: it.photo_order, is_cover: it.is_cover, id: it.id });
    for(const u of (it.extra_images || [])) if(u)
      out.push({ image_url: u, url: it.url, account: it.account, sub_group: it.sub_group,
        ym: it.ym, region: it.region, source: it.source, tags: it.tags, photo_order: it.photo_order, is_cover: false, id: it.id });
  }
  return out;
}

/* SNS는 "스타일 하나 = 카드 하나" 로 그린다.
   같은 keyword(스타일)끼리 묶고, 그 안에서 sub_group으로 줄을 나누고,
   사진마다 계정을 적어준다. 참고 슬라이드 구조와 같은 형태. */
function snsStyleCardsHTML(items){
  const styles = new Map();
  for(const it of items){
    const label = canonKw(it.keyword || '(제목 없음)');
    if(!styles.has(label)) styles.set(label, { label, items: [], months: new Set(), tags: new Set(), regions: new Set() });
    const e = styles.get(label);
    for(const s of expandShots([it])) e.items.push(s);   // 한 게시물의 여러 장을 각각 펼침
    if(it.ym) e.months.add(it.ym);
    if(it.region) e.regions.add(it.region);
    for(const t of (it.tags || [])) e.tags.add(t);
  }
  /* 사진 순서: photo_order 오름차순(없으면 뒤로, 그 안은 등록순 유지) */
  const photoSort = (a, b) => {
    const ao = a.photo_order, bo = b.photo_order;
    if(ao == null && bo == null) return 0;
    if(ao == null) return 1;
    if(bo == null) return -1;
    return ao - bo;
  };
  for(const st of styles.values()) st.items.sort(photoSort);

  /* 박스(스타일) 순서: 저장된 순서 우선, 없으면 사진 많은 순 뒤에 */
  const ord = st => {
    const v = SNS_STYLE_ORDER[styleKey(scatF, st.label)];
    return v == null ? Infinity : v;
  };
  const list = [...styles.values()].sort((a, b) => (ord(a) - ord(b)) || (b.items.length - a.items.length));

  const shotHTML = x => `
      <figure class="snsShot">
        ${x.url
          ? `<a href="${esc(x.url)}" target="_blank" rel="noopener"><img src="${esc(x.image_url || '')}" alt="" loading="lazy"
               referrerpolicy="no-referrer" onerror="imgFail(this)"></a>`
          : `<img src="${esc(x.image_url || '')}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)">`}
        <figcaption>${x.account
          ? `<a href="https://www.instagram.com/${esc(String(x.account).replace(/^@/, ''))}/" target="_blank" rel="noopener">${esc(x.account)}</a>`
          : '<span class="mini">계정 미입력</span>'}</figcaption>
      </figure>`;

  return list.map(st => {
    const months = [...st.months].sort().join(', ');
    const regions = [...st.regions];
    const regionBadge = regions.length
      ? `<span class="snsRegion">${regions.map(r => esc(r)).join(' · ')}</span>` : '';
    const tags = [...st.tags].slice(0, 6);
    const tagRow = tags.length ? `<div class="tagrow">${tags.map(t =>
      `<button class="tagchip${tagFilter === t ? ' on' : ''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')}</div>` : '';

    /* ── 편집 모드: 전체 사진을 한 그리드에 두고 드래그로 순서 변경 + ★ 로 대표 지정 ── */
    if(SNS_EDIT){
      const shots = st.items.map(x => `
        <figure class="snsEditShot${x.is_cover ? ' iscover' : ''}" draggable="true" data-id="${esc(String(x.id))}">
          <button class="coverStar" title="대표로 지정(최대 6장)">★</button>
          <img src="${esc(x.image_url || '')}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)">
          <figcaption>${x.account ? esc(x.account) : '계정 미입력'}</figcaption>
        </figure>`).join('');
      return `<article class="snsStyle editing" draggable="true" data-kwlabel="${esc(st.label)}">
        <header>
          <span class="dragdot">⠿</span>
          <h4>${esc(st.label)}</h4>
          ${regionBadge}
          <span class="mini">사진 ${st.items.length}장${months ? ' · ' + esc(months) : ''}</span>
        </header>
        <div class="snsEditNote">박스를 드래그해 제목 순서를, 사진을 드래그해 사진 순서를 바꿔요 · ★ 는 메인에 보일 대표(최대 6장)</div>
        <div class="snsEditGrid">${shots}</div>
      </article>`;
    }

    /* ── 보기 모드: 대표(★) 사진 앞 3장만 메인에 노출. 나머지는 박스를 누르면 팝업으로 ── */
    let cover = st.items.filter(x => x.is_cover);
    if(!cover.length) cover = st.items;
    cover = cover.slice(0, 3);
    const note = SNS_STYLE_NOTE[styleKey(scatF, st.label)] || '';

    return `<article class="snsStyle clickable" data-kwlabel="${esc(st.label)}">
      <header>
        <h4>${esc(st.label)}</h4>
        ${regionBadge}
        <span class="mini">사진 ${st.items.length}장${months ? ' · ' + esc(months) : ''}</span>
      </header>
      ${tagRow}
      ${note ? `<div class="snsNote">${esc(note)}</div>` : ''}
      <div class="snsCover">${cover.map(x =>
        `<figure class="snsCoverCell">
          <img class="snsCoverImg" src="${esc(x.image_url || '')}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)">
          ${x.region ? `<span class="snsShotRegion">${esc(x.region)}</span>` : ''}
          ${x.source ? `<span class="snsShotSource">${esc(x.source)}</span>` : ''}
          <figcaption class="snsCoverCap">${x.account
            ? `<a href="https://www.instagram.com/${esc(String(x.account).replace(/^@/, ''))}/" target="_blank" rel="noopener">${esc(x.account)}</a>`
            : '<span class="mini">계정 미입력</span>'}${x.source ? ` · ${esc(x.source)}` : ''}</figcaption>
        </figure>`).join('')}</div>
      <div class="snsExpandHint"></div>
    </article>`;
  }).join('');
}

    <div class="snsModalBack" data-close="1"></div>

      <div class="snsModalHead">

        <textarea id="snsModalNote" rows="2" placeholder="이 스타일에 대한 간단한 설명을 적어보세요 (모두에게 저장돼요)"></textarea>

      </div>
      <div class="snsModalFilter" id="snsModalFilter" style="display:none"></div>
      <div class="snsModalGrid" id="snsModalGrid"></div>
    </div>`;
  document.body.appendChild(m);
  m.addEventListener('click', ev => { if(ev.target.dataset.close) closeSnsModal(); });
  document.addEventListener('keydown', ev => { if(ev.key === 'Escape') closeSnsModal(); });
  m.querySelector('#snsModalNoteSave').addEventListener('click', saveSnsModalNote);

function closeSnsModal(){ const m = document.getElementById('snsModal'); if(m) m.style.display = 'none'; }

let SNS_MODAL_LABEL = null;
let SNS_MODAL_ROWS = [];
let SNS_MODAL_ITEMS = [];
let SNS_MODAL_SRC = null;
function openSnsModal(label){
  if(!label) return;
  const m = ensureSnsModal();
  const rows = SB_SNS
    .filter(s => s.category === scatF && canonKw(s.keyword || '(제목 없음)') === label)
    .sort((a, b) => {
      const ao = a.photo_order, bo = b.photo_order;
      if(ao == null && bo == null) return 0;
      if(ao == null) return 1; if(bo == null) return -1; return ao - bo;
    });
  if(!rows.length) return;
  const items = expandShots(rows);   // 한 게시물의 여러 장(extra_images)까지 모두 펼쳐서 보여준다

  const months = [...new Set(rows.map(x => x.ym).filter(Boolean))].sort().join(', ');
  const regions = [...new Set(rows.map(x => x.region).filter(Boolean))].join(' · ');
  SNS_MODAL_LABEL = label;
  SNS_MODAL_ROWS = rows;
  SNS_MODAL_ITEMS = items;
  SNS_MODAL_SRC = null;
  m.querySelector('#snsModalTitle').value = label;
  m.querySelector('#snsModalMeta').textContent = `${regions ? regions + ' · ' : ''}사진 ${items.length}장${months ? ' · ' + months : ''}`;
  m.querySelector('#snsModalNote').value = SNS_STYLE_NOTE[styleKey(scatF, label)] || '';
  /* 이 스타일에 이미 달린 태그들(사진 행들의 합집합) */
  const curTags = [...new Set(rows.flatMap(r => r.tags || []))];
  m.querySelector('#snsModalTags').value = curTags.join(', ');

  /* 소스(셀럽 착장/INSTAGRAM 등) 필터 — 2종류 이상일 때만 노출 */
  const sources = [...new Set(items.map(x => x.source).filter(Boolean))];
  const fbar = m.querySelector('#snsModalFilter');
  if(sources.length >= 2){
    fbar.style.display = '';
    fbar.innerHTML = `<button class="on" data-src="">전체 ${items.length}</button>` +
      sources.map(s => `<button data-src="${esc(s)}">${esc(s)} ${items.filter(x => x.source === s).length}</button>`).join('');
  } else {
    fbar.style.display = 'none'; fbar.innerHTML = '';
  }

  fillSnsModalGrid();
  m.style.display = 'flex';
}

  const list = SNS_MODAL_SRC ? SNS_MODAL_ITEMS.filter(x => (x.source || '') === SNS_MODAL_SRC) : SNS_MODAL_ITEMS;

        : `<img src="${esc(x.image_url || '')}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)">`}

async function saveSnsModalNote(){
  if(!SNS_MODAL_LABEL) return;
  const btn = document.getElementById('snsModalNoteSave');
  const note = document.getElementById('snsModalNote').value.trim();
  const oldName = SNS_MODAL_LABEL;
  const newName = document.getElementById('snsModalTitle').value.trim();
  if(!newName){ toast('제목을 비울 수 없어요'); return; }
  const renaming = newName !== oldName;

  /* 태그 파싱 — 쉼표 구분, # 제거, 중복 제거 */
  const tags = [...new Set(document.getElementById('snsModalTags').value
    .split(',').map(t => t.trim().replace(/^#/, '')).filter(Boolean))];

  btn.textContent = '저장 중…'; btn.disabled = true;
  try{
    /* 1) 제목(keyword) 변경 — 같은 제목으로 등록된 모든 사진(행)에 반영 */
    if(renaming){
      const res = await Promise.all((SNS_MODAL_ROWS || []).map(r =>
        sb.from('trend_signals').update({ keyword: newName }).eq('id', r.id).select('id')));
      const failed = res.filter(r => r.error || !(r.data && r.data.length));
      if(failed.length) throw new Error(`제목이 ${failed.length}건 반영되지 않았습니다 (권한/RLS 확인)`);
      for(const r of (SNS_MODAL_ROWS || [])) r.keyword = newName;   // 로컬 반영
    }

    /* 2) 태그 — 이 스타일의 모든 행에 저장(버블 집계 반영) */
    const res2 = await Promise.all((SNS_MODAL_ROWS || []).map(r =>
      sb.from('trend_signals').update({ tags }).eq('id', r.id).select('id')));
    const failed2 = res2.filter(r => r.error || !(r.data && r.data.length));
    if(failed2.length) throw new Error(`태그가 ${failed2.length}건 저장되지 않았습니다 (권한/RLS 확인)`);
    for(const r of (SNS_MODAL_ROWS || [])) r.tags = tags;

    /* 3) 설명·순서 사전(sns_style_order) — 새 제목 키로 저장. 이름이 바뀌면 옛 키의 순서를 물려주고 옛 행 삭제 */
    const oldKey = styleKey(scatF, oldName), newKey = styleKey(scatF, newName);
    const carriedOrder = SNS_STYLE_ORDER[newKey] ?? SNS_STYLE_ORDER[oldKey];
    const row = { category: scatF, keyword: newName, note: note || null };
    if(carriedOrder != null) row.sort_order = carriedOrder;
    const { error } = await sb.from('sns_style_order').upsert(row, { onConflict: 'category,keyword' }).select('keyword');
    if(error) throw error;
    if(renaming){
      await sb.from('sns_style_order').delete().eq('category', scatF).eq('keyword', oldName);
      delete SNS_STYLE_ORDER[oldKey]; delete SNS_STYLE_NOTE[oldKey];
    }
    if(carriedOrder != null) SNS_STYLE_ORDER[newKey] = carriedOrder;
    if(note) SNS_STYLE_NOTE[newKey] = note; else delete SNS_STYLE_NOTE[newKey];

    toast('저장했습니다');
    closeSnsModal();
    renderStatic();                                   /* 박스 제목·칩 + 버블 갱신 */
  }catch(err){
    console.error(err);
    alert('저장 실패: ' + (err.message || err) + '\n\nsns_ordering.sql(note 칸)과 trend_signals UPDATE 권한을 확인해주세요.');
  }finally{
    btn.textContent = '저장'; btn.disabled = false;
  }
}

/* 드래그로 순서를 바꾸는 최소 구현 — 그리드·세로 스택 모두 대응.
   자기 컨테이너의 직속 항목이 드래그 중일 때만 반응해 사진↔박스가 섞이지 않게 한다. */
function makeSortable(container, itemSel){
  container.querySelectorAll(':scope > ' + itemSel).forEach(el => {
    el.addEventListener('dragstart', e => { el.classList.add('dragging'); e.stopPropagation(); e.dataTransfer.effectAllowed = 'move'; });
    el.addEventListener('dragend',   e => { el.classList.remove('dragging'); e.stopPropagation();
      container.querySelectorAll('.dragover').forEach(x => x.classList.remove('dragover')); });
  });
  container.addEventListener('dragover', e => {
    const dragging = container.querySelector(':scope > ' + itemSel + '.dragging'); if(!dragging) return;
    e.preventDefault(); e.stopPropagation();
    const after = dragAfter(container, itemSel, e.clientX, e.clientY);
    container.querySelectorAll('.dragover').forEach(x => x.classList.remove('dragover'));
    if(after){ after.classList.add('dragover'); container.insertBefore(dragging, after); }
    else container.appendChild(dragging);
  });
}
function dragAfter(container, itemSel, x, y){
  const els = [...container.querySelectorAll(':scope > ' + itemSel + ':not(.dragging)')];
  let best = null, bestD = Infinity;
  for(const el of els){
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const beforeThis = (y < cy - 1) || (Math.abs(y - cy) <= r.height / 2 && x < cx);
    if(!beforeThis) continue;
    const d = Math.hypot(cx - x, cy - y);
    if(d < bestD){ bestD = d; best = el; }
  }
  return best;
}

$('#snsEditBtn')?.addEventListener('click', () => { SNS_EDIT = true;  drawSnsForCat(); });

$('#snsSaveBtn')?.addEventListener('click', async () => {
  const sg = $('#snsKwGrid');
  /* 박스(제목) 순서 */
  const cards = [...sg.querySelectorAll('.snsStyle')];
  const styleRows = cards.map((c, i) => ({ category: scatF, keyword: c.dataset.kwlabel, sort_order: i }));
  /* 사진 순서 + 대표 */
  const photo = [];
  cards.forEach(c => {
    [...c.querySelectorAll('.snsEditShot')].forEach((s, j) => {
      photo.push({ id: s.dataset.id, photo_order: j, is_cover: s.classList.contains('iscover') });
    });
  });

  $('#snsSaveBtn').textContent = '저장 중…'; $('#snsSaveBtn').disabled = true;
  try{
    const { error: e1 } = await sb.from('sns_style_order').upsert(styleRows, { onConflict: 'category,keyword' });
    if(e1) throw e1;
    /* 사진은 행마다 update (RLS update 권한 필요) */
    const res = await Promise.all(photo.map(p =>
      sb.from('trend_signals').update({ photo_order: p.photo_order, is_cover: p.is_cover }).eq('id', p.id).select('id')));
    const failed = res.filter(r => r.error || !(r.data && r.data.length));
    if(failed.length) throw new Error(`사진 ${failed.length}건이 저장되지 않았습니다 (권한/RLS 확인)`);

    /* 로컬 상태도 즉시 반영 */
    for(const r of styleRows) SNS_STYLE_ORDER[styleKey(r.category, r.keyword)] = r.sort_order;
    const byId = new Map(photo.map(p => [String(p.id), p]));
    for(const it of SB_SNS){ const p = byId.get(String(it.id)); if(p){ it.photo_order = p.photo_order; it.is_cover = p.is_cover; } }

    toast?.('순서를 저장했습니다');
    SNS_EDIT = false;
  }catch(err){
    console.error(err);

/* 라이프스타일 — 비슷한 키워드는 테마로 묶어서 보여줌 (카테고리 필터와 무관하게 항상 전체 표시) */
const LIFESTYLE_THEME_MAP = {
  'social sauna': '웰니스·리커버리',
  'recovery economy': '웰니스·리커버리',
  'jjimjilbang revival': '웰니스·리커버리',
  'hiking boom': '등산 붐',
  'hiking style': '등산 붐',
  'running boom': '러닝 붐',
  'digital declutter': '디지털-아날로그 밸런스',
  'analog maximalism': '디지털-아날로그 밸런스',
  'nature proximity': '자연 지향',
  'me-conomy': '미코노미',
};
function aggregateLifestyleThemes(items){
  const map = new Map();
  for(const it of dedupeItems(items)){
    const kw = canonKw((it.keywords||[])[0] || it.note);
    const theme = LIFESTYLE_THEME_MAP[kw] || kw;
    if(!map.has(theme)) map.set(theme, { label: theme, count: 0, items: [], seenUrls: new Set() });
    const e = map.get(theme);
    if(e.seenUrls.has(itemKey(it))) continue;   /* 같은 기사가 중복 수집된 경우 한 번만 */
    e.seenUrls.add(itemKey(it)); e.count++; e.items.push(it);
  }
  return [...map.values()].sort((a,b) => b.count - a.count);
}

function lifeExampleHTML(entry){
  const rows = entry.items.map((s,i) => `
    <div class="kwex" style="margin-bottom:2px">${esc(s.summary || s.note)}</div>
    <a class="kwlink" href="${esc(s.url)}" target="_blank" rel="noopener">${entry.items.length>1?`원문${i+1}`:'원문 보기'} →</a>`).join('<div style="height:6px"></div>');
  /* 연결 배지는 카드 바깥(kwCardHTML)에서 그리므로 여기서는 본문만 반환 */
  return rows;
}

/* ── 카드에서 해시태그 바로 편집 ─────────────────────────────
   ✎ 버튼 클릭 → tagrow가 편집 폼(input + 저장/취소)으로 바뀜
   Enter 또는 저장 클릭 → Supabase trend_signals.tags 를 새 배열로 update
   Esc 또는 취소 클릭 → 편집 폼을 원래 태그 목록으로 되돌림
   태그는 콤마로 구분해서 입력, 양 옆 공백은 자동 제거 */
function _tagsFromInput(v){
  return (v||'').split(',').map(s => s.trim()).filter(Boolean);
}
function _restoreTagRow(id){
  /* SB_NEWS/SB_LIFESTYLE/SB_SNS에서 이 id의 최신 tags를 찾아 다시 그림 */
  const found = [...SB_NEWS, ...SB_LIFESTYLE, ...SB_SNS].find(x => String(x.id) === String(id));
  if(!found) return;
  const rows = document.querySelectorAll(`.tagrow[data-id="${CSS.escape(String(id))}"]`);
  rows.forEach(row => {
    row.innerHTML = (found.tags || []).map(t =>
      `<button class="tagchip${tagFilter === t ? ' on' : ''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')
      + `<button class="tagedit" data-id="${esc(id)}" title="태그 편집">✎</button>`;
  });
}

document.addEventListener('submit', async e => {
  const form = e.target.closest('.tagedit-form'); if(!form) return;
  e.preventDefault();
  const row = form.closest('.tagrow'); if(!row) return;
  const id = row.dataset.id;

  const btn = form.querySelector('.tagedit-save'); if(btn){ btn.disabled = true; btn.textContent = '저장 중…'; }
  try{
    const { error } = await sb.from('trend_signals').update({ tags: newTags }).eq('id', id);
    if(error) throw error;
    /* 로컬 캐시(SB_NEWS/LIFESTYLE/SNS)도 같이 반영해서 화면·필터·버블이 즉시 새 태그로 동작 */
    for(const arr of [SB_NEWS, SB_LIFESTYLE, SB_SNS]){
      const x = arr.find(y => String(y.id) === String(id));
      if(x) x.tags = newTags;
    }
    renderCurrentView();
  }catch(err){
    alert('태그 저장 실패: ' + (err.message || err));
    if(btn){ btn.disabled = false; btn.textContent = '저장'; }
  }
});

/* ── 클러스터 상세 모달 ─────────────────────────────────────
   버블의 ⋯ 버튼을 누르면 열림.
   상단: 대표 키워드 크게 / 유사 키워드 칩 / 카드 목록
   카드 정렬: 대표+유사 태그와 매칭되는 태그 수가 많은 순, 2개 이상 매칭만 표시 */
function openClusterModal(head){
  const cluster = CLUSTERS[head] || [];
  const memberSet = new Set([head, ...cluster]);
  /* 현재 화면(현재 카테고리 + 월 필터)에 속한 카드들 대상으로 매칭 */
  const pool = [...NEWS_SIG, ...SB_NEWS, ...SB_LIFESTYLE, ...SB_SNS].filter(s => {
    if(s.category !== scatF && scatF !== 'lifestyle') return false;
    if(scatF === 'lifestyle' && s.category !== 'lifestyle') return false;
    return inMonth(s);
  });
  /* 각 카드마다 매칭 태그 수 계산 (2개 이상만) */
  const scored = [];
  for(const it of pool){
    const tags = it.tags || [];
    const matched = tags.filter(t => memberSet.has(t));
    if(matched.length >= 2) scored.push({ it, matched });
  }
  scored.sort((a,b) => b.matched.length - a.matched.length
    || (b.it.ym||'').localeCompare(a.it.ym||''));

  const chips = [head, ...cluster].map(t =>
    `<span class="cmChip${t === head ? ' head' : ''}" data-tagedit="${esc(t)}" title="눌러서 이름 바꾸기 · 삭제">#${esc(t)}</span>`).join('');

  const cardsHTML = scored.length ? scored.map(({it, matched}) => {
    const title = it.note || it.keyword || (it.keywords && it.keywords[0]) || '';
    const text = it.summary || '';
    return `<div class="cmCard">
      ${it.image_url ? `<img src="${esc(it.image_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)">` : '<div class="imgfail" style="width:100%;aspect-ratio:1"></div>'}
      <div class="cmCardBody">
        <div class="cmMatchBadge">매칭 ${matched.length}개</div>
        <div class="cmCardTitle">${esc(title)}</div>
        ${text ? `<div class="cmCardText">${esc(text.length > 90 ? text.slice(0,90)+'…' : text)}</div>` : ''}
        <div class="cmCardTags">${matched.map(t =>
          `<span class="cmChipMini">#${esc(t)}</span>`).join('')}</div>
        ${it.url ? `<a class="cmCardLink" href="${esc(it.url)}" target="_blank" rel="noopener">원문 보기 →</a>` : ''}
      </div>
    </div>`;
  }).join('') : '<div class="empty" style="padding:24px 0">2개 이상 매칭되는 카드가 아직 없어요</div>';

  /* ── 다른 카테고리에서 이 클러스터 태그를 공유하는 관련 트렌드 ── */
  /* 현재 탭이 아닌 다른 카테고리 카드 중, 이 클러스터 태그가 하나라도 있는 것들 수집.
     사진 없이 제목·매칭 태그·링크만 카테고리별로 그룹핑해서 표시. */
  const otherPool = [...NEWS_SIG, ...SB_NEWS, ...SB_LIFESTYLE, ...SB_SNS].filter(s => {
    if(s.category === scatF) return false;                      /* 현재 카테고리는 제외 */
    if(scatF === 'lifestyle' && s.category === 'lifestyle') return false;
    return inMonth(s);
  });
  const relatedByCat = {};
  for(const it of otherPool){
    const matched = (it.tags || []).filter(t => memberSet.has(t));
    if(!matched.length) continue;
    const cat = it.category || 'etc';
    (relatedByCat[cat] ||= []).push({ it, matched });
  }
  /* 각 카테고리 안에서는 매칭 태그 많은 순 → 최신순 */
  for(const cat in relatedByCat){
    relatedByCat[cat].sort((a,b) => b.matched.length - a.matched.length
      || (b.it.ym || '0').localeCompare(a.it.ym || '0'));
  }
  const catOrder = Object.keys(relatedByCat).sort((a,b) => (CAT_LABEL[a] || a).localeCompare(CAT_LABEL[b] || b, 'ko'));
  const relatedHTML = catOrder.length ? `
    <div class="cmRelSec">
      <div class="cmRelHead">다른 카테고리 관련 트렌드</div>
      <div class="cmRelSub">이 클러스터 태그가 걸린 다른 카테고리 카드들 (사진 없이 제목·링크만)</div>
      <div class="cmRelGroups">${catOrder.map(cat => `
        <div class="cmRelGroup">
          <div class="cmRelCat">${esc(CAT_LABEL[cat] || cat)}</div>
          <ul class="cmRelList">
            ${relatedByCat[cat].map(({it, matched}) => {
              const title = it.note || it.keyword || (it.keywords && it.keywords[0]) || '(제목 없음)';
              const tagStr = matched.map(t => `#${t}`).join(' ');
              return `<li>
                ${it.url
                  ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(title)}</a>`
                  : `<span>${esc(title)}</span>`}
                <span class="cmRelTags">${esc(tagStr)}</span>
              </li>`;
            }).join('')}
          </ul>
        </div>`).join('')}
      </div>
    </div>` : '';

  const html = `<div class="cmOverlay">
    <div class="cmBox">
      <button class="cmClose" aria-label="닫기">×</button>
      <div class="cmHead">#${esc(head)}</div>
      <div class="cmSub">이 클러스터의 유사 키워드 · 매칭 태그 2개 이상인 카드를 겹침 많은 순으로 표시</div>
      <div class="cmChips">${chips}</div>
      <div class="cmEditBar">
        태그를 눌러서 <b>이름 바꾸기</b>나 <b>삭제</b>를 할 수 있어요 — 그 태그가 달린 모든 카드에 적용됩니다
      </div>
      <div class="cmMergeBar">
        <span class="cmMergeLabel">여러 개 → 하나로 합치기</span>
        <input class="cmMergeFrom" value="${esc([head, ...cluster].join(', '))}" placeholder="합칠 태그들 — 쉼표로 (예: hairband, headband)">
        <span class="cmMergeArrow">→</span>
        <input class="cmMergeTo" value="${esc(head)}" placeholder="대표 태그">
        <button class="go" data-tagmerge="1">합치기</button>
        <span class="cmMergeMsg mini"></span>
      </div>
      <div class="cmGrid">${cardsHTML}</div>
      ${relatedHTML}
    </div>
  </div>`;
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
}

  if(e.target.closest('.cmClose') || e.target.classList.contains('cmOverlay')){

/* ═══ 해시태그 바로 고치기 ═══
   클러스터 상세 창에서 태그를 누르면 이름 바꾸기·삭제 도구가 열린다.
   그 태그가 달린 모든 카드에 적용되므로 삭제는 한 번 더 확인한다. */

/* 대상 카드 찾기 — 그 태그가 달린 모든 항목 */
async function tagTargets(tag){
  const { data, error } = await sb.from('trend_signals').select('id, tags').contains('tags', [tag]);
  if(error){ alert('불러오기 실패: ' + error.message); return null; }
  return data || [];
}

document.addEventListener('click', async e => {
  if(e.target.closest('[data-tagcancel]')){ e.target.closest('.cmEditBox')?.remove(); return; }

  const box = e.target.closest('.cmEditBox');
  const msg = () => box?.querySelector('.cmEditMsg');

  /* 여러 개 → 하나로 합치기 (+ 사전에 기억해 다음부터 자동 통일) */
  const mg = e.target.closest('[data-tagmerge]');
  if(mg){
    const bar = e.target.closest('.cmMergeBar');
    const mmsg = () => bar?.querySelector('.cmMergeMsg');
    const to = bar.querySelector('.cmMergeTo').value.trim().replace(/^#/, '');
    const froms = bar.querySelector('.cmMergeFrom').value.split(',').map(s => s.trim().replace(/^#/, '')).filter(Boolean);
    if(!to){ mmsg().textContent = '대표 태그를 입력해 주세요'; return; }
    /* 사전에 기억할 변형: 대표와 "정확히 같은 문자열"만 제외 → 대소문자만 다른 것(Hair-accessory)도 포함 */
    const variants = [...new Set(froms.filter(f => f !== to))];
    if(!variants.length){ mmsg().textContent = '합칠 태그를 대표와 다르게 입력해 주세요'; return; }
    const all = [...new Set([...froms, to])];
    const { data: rows, error } = await sb.from('trend_signals').select('id, tags').overlaps('tags', all);
    if(error){ alert('불러오기 실패: ' + error.message); return; }
    if(!confirm(`${variants.map(v => '#' + v).join(', ')} → #${to}\n\n${(rows || []).length}개 항목에 적용되고, 앞으로 같은 표기는 자동으로 #${to}로 통일됩니다. 진행할까요?`)) return;
    mmsg().textContent = '합치는 중…';
    /* 행 치환 기준: 합칠 태그 + 대표의 대소문자 변형까지 모두 대표 문자열로 */
    const matchLower = new Set([...froms, to].map(s => s.toLowerCase()));
    for(const r of (rows || [])){
      const next = [...new Set((r.tags || []).map(t => matchLower.has(String(t).toLowerCase()) ? to : t))];
      await sb.from('trend_signals').update({ tags: next }).eq('id', r.id);
    }
    /* 사전(keyword_aliases)에 기억 — 다음 유입부터 자동 통일 */
    try{
      await sb.from('keyword_aliases').upsert(variants.map(v => ({ alias: v, canonical: to })), { onConflict: 'alias' });
    }catch(err){ console.warn('keyword_aliases 저장 실패(테이블/유니크 확인):', err?.message || err); }
    /* 클러스터 사전도 best-effort로 정리 */
    try{
      for(const v of variants){
        const { data: cls } = await sb.from('tag_clusters').select('head, members').contains('members', [v]);
        for(const c of (cls || [])) await sb.from('tag_clusters')
          .update({ members: [...new Set((c.members || []).map(m => m === v ? to : m))] }).eq('head', c.head);
        await sb.from('tag_clusters').update({ head: to }).eq('head', v);
      }
    }catch(_){}
    document.querySelector('.cmOverlay')?.remove();
    if(matchLower.has(String(tagFilter || '').toLowerCase())) tagFilter = to;
    await loadAliases(); await loadTrendSignals();
    return;
  }

  /* 이름 바꾸기 */
  const rn = e.target.closest('[data-tagrename]');
  if(rn){
    const from = rn.dataset.tagrename;
    const to = box.querySelector('.cmNewName').value.trim().toLowerCase().replace(/^#/, '');
    if(!to || to === from){ msg().textContent = '새 이름을 입력해 주세요'; return; }
    const rows = await tagTargets(from); if(!rows) return;
    if(!confirm(`#${from} → #${to}\n\n이 태그가 달린 ${rows.length}개 항목에 모두 적용됩니다. 진행할까요?`)) return;
    msg().textContent = '바꾸는 중…';
    for(const r of rows){
      const next = [...new Set((r.tags || []).map(t => t === from ? to : t))];
      await sb.from('trend_signals').update({ tags: next }).eq('id', r.id);
    }
    /* 사전에도 반영 */
    const { data: cls } = await sb.from('tag_clusters').select('head, members').contains('members', [from]);
    for(const c of (cls || [])){
      await sb.from('tag_clusters')
        .update({ members: [...new Set((c.members || []).map(m => m === from ? to : m))] }).eq('head', c.head);
    }
    await sb.from('tag_clusters').update({ head: to }).eq('head', from);
    document.querySelector('.cmOverlay')?.remove();
    if(tagFilter === from) tagFilter = to;
    await loadAliases(); await loadTrendSignals();
    return;
  }

  /* 삭제 */
  const rm = e.target.closest('[data-tagremove]');
  if(rm){
    const tag = rm.dataset.tagremove;
    const rows = await tagTargets(tag); if(!rows) return;
    if(!confirm(`#${tag} 태그를 지웁니다.\n\n이 태그가 달린 ${rows.length}개 항목에서 빠지고 사전에서도 제거됩니다.\n되돌릴 수 없습니다. 진행할까요?`)) return;
    msg().textContent = '지우는 중…';
    for(const r of rows){
      await sb.from('trend_signals').update({ tags: (r.tags || []).filter(t => t !== tag) }).eq('id', r.id);
    }
    const { data: cls } = await sb.from('tag_clusters').select('head, members').contains('members', [tag]);
    for(const c of (cls || [])){
      await sb.from('tag_clusters')
        .update({ members: (c.members || []).filter(m => m !== tag) }).eq('head', c.head);
    }
    document.querySelector('.cmOverlay')?.remove();
    if(tagFilter === tag) tagFilter = null;
    await loadAliases(); await loadTrendSignals();
    return;
  }
});

/* ── 대표어(해시태그 사전) 관리 모달 ───────────────────────── */
function ensureAliasModal(){

  m = document.createElement('div');

  m.innerHTML = `
    <div class="snsModalBack" data-aclose="1"></div>
    <div class="snsModalPanel aliasModalPanel" role="dialog" aria-modal="true" style="max-width:720px">
      <button class="snsModalX" data-aclose="1" title="닫기">✕</button>
      <div class="aliasFixed">
      <div class="snsModalHead"><h3 style="margin:0">해시태그 관리 · 대표어 묶기</h3></div>
      <div class="mini" style="margin:-4px 0 12px">아래는 지금 카드들에 달린 <b>전체 해시태그</b>예요. 유사한 태그를 골라 <b>묶기</b>하고 그중 하나를 <b>대표</b>로 정하면, 버블 차트가 그 대표어로 합산됩니다. (원본 카드는 안 바뀌어요)</div>
      <input class="aliasSearch" placeholder="해시태그 검색…" style="width:100%; font:inherit; font-size:12.5px; border:1px solid var(--hair); border-radius:9px; padding:8px 11px; background:#fff; margin-bottom:10px">
      <div class="aliasTop2">
        <button class="aliasAuto" data-autogroup="1">✨ 표기 자동 묶기</button>
        <span class="mini">대소문자·띄어쓰기·하이픈만 다른 태그를 한 번에 통일해요. 뜻으로 묶는 건 아래에서 직접(또는 끌어놓기).</span>
      </div>
      <div class="aliasSelBar" style="display:none">
        <span><b class="aliasSelCount">0</b>개 선택</span>
        <span class="aliasSelArrow">→ 대표</span>
        <select class="aliasSelRep"></select>
        <input class="aliasSelNew" placeholder="또는 새 대표어 입력">
        <button class="go" data-groupsel="1">묶기</button>
        <button class="aliasSelClear" data-selclear="1">해제</button>
      </div>
      <div class="aliasTagList" id="aliasTagList"></div>
      </div>
      <div class="aliasGroupsWrap">
        <div class="mini aliasGroupsHead" style="font-weight:800; margin:16px 0 8px; color:var(--tx)">묶어둔 대표어</div>
        <div id="aliasBody"></div>
      </div>
    </div>`;
  document.body.appendChild(m);
  m.addEventListener('click', ev => { if(ev.target.dataset.aclose) closeAliasModal(); });
  m.querySelector('.aliasSearch').addEventListener('input', e => renderAliasTagList(e.target.value));
  /* 끌어놓기 — 위 목록의 태그를 아래 묶음(또는 다른 태그) 위에 놓으면 그 대표어로 묶임 */
  m.addEventListener('dragstart', e => {
    const t = e.target.closest('[data-tagpick]'); if(!t) return;
    e.dataTransfer.setData('text/plain', t.dataset.tagpick);
    e.dataTransfer.effectAllowed = 'move';
  });
  m.addEventListener('dragover', e => {
    const z = e.target.closest('.aliasGroup, [data-tagpick]'); if(!z) return;
    e.preventDefault(); z.classList.add('drophot');
  });
  m.addEventListener('dragleave', e => {
    const z = e.target.closest('.aliasGroup, [data-tagpick]'); if(z) z.classList.remove('drophot');
  });
  m.addEventListener('drop', async e => {
    const dragged = e.dataTransfer.getData('text/plain');
    m.querySelectorAll('.drophot').forEach(x => x.classList.remove('drophot'));
    if(!dragged) return;
    const grp = e.target.closest('.aliasGroup');
    const tagt = e.target.closest('[data-tagpick]');
    const canonical = grp ? grp.dataset.canon : (tagt ? tagt.dataset.tagpick : null);
    if(!canonical || normKw(canonical) === normKw(dragged)) return;
    e.preventDefault();
    if(await addAliasMapping(dragged, canonical)){ toast(`#${dragged} → #${canonical}`); ALIAS_SEL.delete(dragged); afterAliasChange(); }
  });
  return m;
}

/* 유사어 → 대표어 매핑 저장 (대상이 이미 대표였던 태그면 그 하위도 새 대표로 재지정) */
async function addAliasMapping(alias, canonical){
  if(!alias || !canonical || normKw(alias) === normKw(canonical)) return false;
  await sb.from('tag_aliases').update({ canonical }).eq('canonical', alias);
  const { error } = await sb.from('tag_aliases').upsert([{ alias, canonical }], { onConflict: 'alias' });
  if(error){ alert('저장 실패: ' + error.message + '\n\ntag_aliases.sql을 실행했는지 확인해 주세요.'); return false; }
  return true;
}
function closeAliasModal(){ const m = document.getElementById('aliasModal'); if(m) m.style.display = 'none'; }

let ALIAS_SEL = new Set();   /* 묶기용으로 체크한 태그들 */
async function openAliasModal(){
  const m = ensureAliasModal();
  ALIAS_SEL = new Set();
  await loadTagAliases();
  renderAliasTagList('');
  renderAliasBody();
  m.style.display = 'flex';
}

/* 현재 카드 전체의 (대표어 적용된) 태그 → 건수 */
function allTagCounts(){
  const m = new Map();
  for(const s of [...SB_NEWS, ...SB_LIFESTYLE, ...SB_SNS])
    for(const t of (s.tags || [])) m.set(t, (m.get(t) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
function renderAliasTagList(filter){
  const box = document.getElementById('aliasTagList'); if(!box) return;
  const canonSet = new Set(Object.values(TAG_ALIAS).map(v => normKw(v)));
  const q = normKw(filter || '');
  const rows = allTagCounts().filter(([t]) => !q || normKw(t).includes(q));
  if(!rows.length){ box.innerHTML = '<div class="mini" style="padding:12px 0">해당하는 해시태그가 없어요.</div>'; return; }
  box.innerHTML = rows.map(([t, n]) => {
    const isRep = canonSet.has(normKw(t));
    const sel = ALIAS_SEL.has(t) ? ' on' : '';
    return `<label class="aliasTag${sel}" data-tagpick="${esc(t)}" draggable="true" title="끌어서 아래 묶음에 놓으면 그 대표어로 묶여요">
      <input type="checkbox" ${ALIAS_SEL.has(t) ? 'checked' : ''}>
      <span class="aliasTagName">#${esc(t)}</span>
      <span class="aliasTagCnt">${n}</span>
      ${isRep ? '<span class="aliasTagBadge rep">대표</span>' : ''}
    </label>`;
  }).join('');
  updateAliasSelBar();
}
function updateAliasSelBar(){
  const m = document.getElementById('aliasModal'); if(!m) return;
  const bar = m.querySelector('.aliasSelBar');
  const picked = [...ALIAS_SEL];
  if(!picked.length){ bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  m.querySelector('.aliasSelCount').textContent = picked.length;
  const rep = m.querySelector('.aliasSelRep');
  const cur = rep.value;
  rep.innerHTML = picked.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  if(picked.includes(cur)) rep.value = cur;
}
function renderAliasBody(){
  const body = document.getElementById('aliasBody'); if(!body) return;
  const groups = new Map();
  for(const [alias, canon] of Object.entries(TAG_ALIAS)){
    if(!groups.has(canon)) groups.set(canon, []);
    groups.get(canon).push(alias);
  }
  if(!groups.size){
    body.innerHTML = '<div class="mini" style="padding:8px 0">아직 묶어둔 대표어가 없어요. 위 목록에서 유사어를 골라 묶어 보세요.</div>';
    return;
  }
  const rows = [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  body.innerHTML = rows.map(([canon, aliases]) => `
    <div class="aliasGroup" data-canon="${esc(canon)}">
      <div class="aliasGroupHead">
        <span class="aliasCanon">#${esc(canon)}</span>
        <span class="mini">유사어 ${aliases.length}</span>
        <button class="aliasDelGroup" data-delgroup="${esc(canon)}" title="이 묶음 전체 삭제">묶음 삭제</button>
      </div>
      <div class="aliasVars">
        ${aliases.sort().map(a => `<span class="aliasVar">#${esc(a)}<button data-delvar="${esc(a)}" title="이 유사어 제거">✕</button></span>`).join('')}
        <span class="aliasAddVar">
          <input placeholder="유사어 추가" data-addvarinput="${esc(canon)}">
          <button data-addvar="${esc(canon)}">+</button>
        </span>
      </div>
    </div>`).join('');
}

/* 선택한 태그들을 하나의 대표어로 묶기 */
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-groupsel]');
  if(g){
    const m = document.getElementById('aliasModal');
    const picked = [...ALIAS_SEL];
    if(picked.length < 1){ toast('묶을 태그를 선택해 주세요'); return; }
    const newRep = m.querySelector('.aliasSelNew').value.trim().replace(/^#/, '');
    const rep = newRep || m.querySelector('.aliasSelRep').value;
    if(!rep){ toast('대표어를 정해 주세요'); return; }
    const members = [...new Set(picked.filter(t => normKw(t) !== normKw(rep)))];
    if(!members.length){ toast('대표어와 다른 태그를 하나 이상 선택해 주세요'); return; }
    /* 이미 대표였던 태그를 유사어로 넣는 경우, 그 밑 유사어들도 새 대표로 재지정 */
    for(const mtag of members){
      await sb.from('tag_aliases').update({ canonical: rep }).eq('canonical', mtag);
    }
    const { error } = await sb.from('tag_aliases').upsert(members.map(v => ({ alias: v, canonical: rep })), { onConflict: 'alias' });
    if(error){ alert('저장 실패: ' + error.message + '\n\ntag_aliases.sql을 실행했는지 확인해 주세요.'); return; }
    ALIAS_SEL = new Set();
    m.querySelector('.aliasSelNew').value = '';
    toast(`#${rep}로 묶었어요`);
    afterAliasChange();
    return;
  }
  const clr = e.target.closest('[data-selclear]');
  if(clr){ ALIAS_SEL = new Set(); renderAliasTagList(document.querySelector('#aliasModal .aliasSearch')?.value || ''); return; }
  /* 표기 자동 묶기 — 대소문자/띄어쓰기/하이픈만 다른 태그를 대표어로 통일 */
  const ag = e.target.closest('[data-autogroup]');
  if(ag){
    const canonSet = new Set(Object.values(TAG_ALIAS).map(v => normKw(v)));
    const byKey = new Map();
    for(const [t, c] of allTagCounts()){
      const k = normKw(t).replace(/[\s\-_]/g, '');
      if(!k) continue;
      if(!byKey.has(k)) byKey.set(k, []);
      byKey.get(k).push([t, c]);
    }
    const ups = []; let merged = 0;
    for(const [, arr] of byKey){
      if(arr.length < 2) continue;
      const rep = (arr.find(([t]) => canonSet.has(normKw(t))) || [])[0]
        || (arr.find(([t]) => t.includes('-')) || [])[0]
        || arr.slice().sort((a, b) => b[1] - a[1])[0][0];
      for(const [t] of arr) if(normKw(t) !== normKw(rep)) { ups.push({ alias: t, canonical: rep }); merged++; }
    }
    if(!ups.length){ toast('표기만 다른 태그는 없어요'); return; }
    const { error } = await sb.from('tag_aliases').upsert(ups, { onConflict: 'alias' });
    if(error){ alert('저장 실패: ' + error.message); return; }
    toast(`${merged}개 표기를 자동으로 묶었어요`);
    afterAliasChange();
    return;
  }
});

document.addEventListener('click', async e => {

    afterAliasChange();
    return;

    const { error } = await sb.from('tag_aliases').delete().eq('alias', dv.dataset.delvar);
    if(error){ alert('삭제 실패: ' + error.message); return; }
    afterAliasChange();
    return;
  }
  const dg = e.target.closest('[data-delgroup]');
  if(dg){
    if(!confirm(`#${dg.dataset.delgroup} 묶음을 삭제할까요? (유사어들이 더 이상 대표어로 합쳐지지 않습니다)`)) return;
    const { error } = await sb.from('tag_aliases').delete().eq('canonical', dg.dataset.delgroup);
    if(error){ alert('삭제 실패: ' + error.message); return; }
    afterAliasChange();
    return;
  }
});

async function loadAliases(){
  try{
    const { data, error } = await sb.from('keyword_aliases').select('alias,canonical');
    if(error){ console.warn('keyword_aliases 로드 실패 (테이블이 아직 없을 수 있음):', error.message); return; }
    ALIAS_MAP = Object.fromEntries((data||[]).map(r => [normKw(r.alias), r.canonical]));
    renderStatic();
  }catch(e){ console.warn('keyword_aliases 로드 실패:', e); }
}

load();
renderStatic();
loadTagAliases().then(loadTagClusters).then(loadTrendSignals);
loadRunway().then(() => { if(scatF === 'shoes') renderRunway(); });
loadAliases();
// loadSnsSheet();  // SNS 데이터 일단 비활성화 — 다시 켜려면 이 줄 주석 해제
</script>
