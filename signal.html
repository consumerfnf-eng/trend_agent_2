<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Signal — Trend Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2; --card:#ffffff; --hair:#e4ded2; --tx:#1d1d1b; --sub:#8a8578;
  --up:#1a7a4a; --dn:#c8451f; --acc:#c8451f}
*{box-sizing:border-box; margin:0}
body{background:var(--bg); color:var(--tx); font-family:'Noto Sans KR','Inter',sans-serif; font-size:13px}
header{display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--tx); position:sticky; top:0; background:var(--bg); z-index:10}
header h1{font-family:'Playfair Display',serif; font-size:22px; font-weight:700; letter-spacing:.01em}
header h1 span{color:var(--sub); font-weight:600; font-size:11px; margin-left:8px}
nav{display:flex; gap:4px; margin-left:20px}
nav button{border:0; background:none; color:var(--sub); padding:7px 12px; cursor:pointer; font:inherit; border-radius:6px}
nav button.on{background:var(--tx); color:#fff; font-weight:700}
.mrange{margin-left:auto; display:flex; align-items:center; gap:6px; font-size:11px; color:var(--sub)}
.mrange label{font-weight:700; letter-spacing:.06em; text-transform:uppercase}
.mrange select{background:#fff; color:var(--tx); border:1px solid var(--hair); border-radius:6px; padding:6px 10px; font:inherit}
.mrange span{color:var(--sub)}
main{padding:20px 22px; max-width:1200px; margin:0 auto}
.view{display:none} .view.on{display:block}
h2{font-size:16px; margin-bottom:2px}
.sub{color:var(--sub); font-size:11px; margin-bottom:16px}
.top5{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:18px}
.tcard{background:var(--card); border:1px solid var(--hair); border-radius:10px; padding:12px; cursor:pointer; position:relative; min-height:150px; display:flex; flex-direction:column}
.tcard:hover{border-color:var(--acc)}
.tcard .rk{position:absolute; top:10px; left:10px; width:20px; height:20px; border-radius:5px; background:var(--tx); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center}
.tcard .st{position:absolute; top:10px; right:10px; font-size:9px; font-weight:800; letter-spacing:.08em}
.st.Rising{color:var(--up)} .st.New{color:var(--acc)} .st.Falling{color:var(--dn)}
.tcard img{width:100%; height:84px; object-fit:cover; border-radius:6px; margin:24px 0 8px; background:#efeae1}
.tcard .nm{font-weight:700; font-size:13px; margin-top:auto}
.tcard .ct{color:var(--sub); font-size:10px}
.panelrow{display:grid; grid-template-columns:1.5fr 1fr; gap:14px}
.card{background:var(--card); border:1px solid var(--hair); border-radius:10px; padding:14px}
.card h3{font-size:11px; letter-spacing:.1em; color:var(--sub); margin-bottom:10px; font-weight:700}
.chg{display:flex; justify-content:space-between; align-items:center; padding:7px 2px; border-top:1px solid var(--hair); font-size:12px}
.chg:first-of-type{border-top:0}
.chg .v{font-weight:800}
.up{color:var(--up)} .dn{color:var(--dn)} .fl{color:var(--sub)}
svg.spark{display:block}
table{width:100%; border-collapse:collapse}
th{font-size:9px; letter-spacing:.14em; color:var(--sub); text-align:left; padding:8px 10px; border-bottom:1px solid var(--hair)}
td{padding:10px; border-bottom:1px solid var(--hair); font-size:12px; vertical-align:middle}
tr.krow{cursor:pointer} tr.krow:hover{background:#faf6ec}
.pillb{display:inline-block; font-size:9px; font-weight:800; padding:2px 8px; border-radius:10px}
.pillb.New{background:#e7efe9; color:#1a7a4a} .pillb.Rising{background:#1a7a4a; color:#fff}
.pillb.PEAK{background:#f3e7cf; color:#8a6a1f} .pillb.DESCEND{background:#f7e2dc; color:#c8451f}
.fbar{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap}
.fbar button{border:1px solid var(--hair); background:none; color:var(--sub); padding:5px 12px; border-radius:14px; cursor:pointer; font:inherit; font-size:11px}
.fbar button.on{background:var(--tx); color:#fff; font-weight:700; border-color:var(--tx)}
.fbar input{margin-left:auto; background:#fff; border:1px solid var(--hair); color:var(--tx); border-radius:6px; padding:6px 10px; font:inherit}
#detail{position:fixed; right:-560px; top:0; bottom:0; width:540px; max-width:96vw; background:var(--bg);
  border-left:1px solid var(--hair); transition:right .28s; z-index:40; overflow-y:auto; padding:20px}
#detail.open{right:0}
#dim{position:fixed; inset:0; background:#0004; opacity:0; pointer-events:none; transition:.28s; z-index:35}
#dim.open{opacity:1; pointer-events:auto}
#detail .x{position:absolute; top:12px; right:14px; background:none; border:0; color:var(--sub); font-size:20px; cursor:pointer}
#detail .hero{width:100%; max-height:330px; object-fit:cover; border-radius:10px; background:#efeae1}
#detail h2{font-family:'Playfair Display',serif; font-size:24px; margin:12px 0 2px}
#detail .k{font-size:10px; letter-spacing:.16em; color:var(--sub); text-transform:uppercase}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0}
.stats .s{background:#faf7f2; border:1px solid var(--hair); border-radius:8px; padding:10px}
.stats .s b{display:block; font-size:16px}
.stats .s span{font-size:9px; letter-spacing:.1em; color:var(--sub); text-transform:uppercase}
#detail h4{font-size:10px; letter-spacing:.16em; color:var(--sub); margin:16px 0 8px; border-top:1px solid var(--hair); padding-top:12px}
.ref{display:flex; gap:8px; align-items:center; padding:6px 0; border-top:1px solid var(--hair); font-size:12px}
.ref:first-of-type{border-top:0}
.ref .r{color:var(--acc); font-weight:800; min-width:34px}
.looks{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.looks figure{margin:0}
.looks img{width:100%; height:110px; object-fit:cover; border-radius:6px; background:#efeae1}
.looks figcaption{font-size:9px; color:var(--sub); padding-top:2px}
.apply{background:#fdf3ef; border:1px solid #ecc9bc; border-radius:8px; padding:12px; font-size:12px; line-height:1.6}
.empty{color:var(--sub); padding:30px 0; text-align:center}
.rgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin-top:14px}
.rcard{background:var(--card); border:1px solid var(--hair); border-left:3px solid var(--acc); border-radius:8px; padding:12px 14px; display:flex; flex-direction:column}
.rcard .rt{font-weight:700; font-size:12.5px; line-height:1.4; margin-bottom:6px}
.rcard .rs{font-size:11.5px; color:var(--sub); line-height:1.55; margin-bottom:8px; flex:1}
.rcard .rmeta{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px}
.rcard .rmeta .cat{font-size:9px; font-weight:800; letter-spacing:.08em; background:#f4efe6; color:#8a8172; padding:2px 8px; border-radius:9px; text-transform:uppercase}
.rcard .rmeta .kw{font-size:9px; background:#fdf3ef; color:var(--acc); padding:2px 8px; border-radius:9px}
.rcard a.rlink{font-size:10.5px; font-weight:700; color:var(--acc); text-decoration:none; align-self:flex-start}
.sfoot{padding:8px 10px; font-size:10px; color:var(--sub); text-align:center}
.srcBlock{margin-top:30px; padding-top:18px; border-top:1px solid var(--hair)}
.srcTitle{font-size:13px; margin:0 0 2px; display:flex; align-items:center; gap:8px}
.srcCnt{font-size:10px; font-weight:700; color:var(--acc); background:#fdf3ef; padding:2px 8px; border-radius:9px}
.bubbleWrap{margin:14px 0 18px; display:flex; flex-direction:column; align-items:stretch; gap:8px; padding:14px 8px}
.bubbleTabsRowLeft{display:flex; justify-content:flex-start}
/* ── 반복 단어 자동 감지 리포트 ── */
.repWrap{margin:14px 0 22px; padding:22px 24px; background:#faf5ec; border-radius:12px; border:1px solid var(--hair)}
.repHead{font-family:'Cormorant Garamond', serif; font-size:22px; font-weight:600; color:var(--tx); margin-bottom:2px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.repHead .repSub{font-family:inherit; font-size:10.5px; color:var(--sub); font-weight:400; letter-spacing:.03em}
.repBlock{background:#fff; border-radius:10px; padding:18px 22px; margin-top:14px; border:1px solid var(--hair)}
.repBadge{display:inline-block; font-size:10px; font-weight:800; letter-spacing:.1em; padding:3px 10px; border-radius:20px;
  background:#fdf3ef; color:var(--acc); margin-bottom:10px}
/* 번호 + 제목 바 — 참고 레이아웃처럼 왼쪽 굵은 선과 옅은 배경 */
.repTitleBar{display:flex; align-items:stretch; margin:10px 0 16px; border-left:4px solid var(--acc);
  background:#fdf3ef; border-radius:0 8px 8px 0; overflow:hidden}
.repNum{flex:0 0 52px; display:flex; align-items:center; justify-content:center;
  font-family:'Cormorant Garamond', serif; font-size:26px; font-weight:600; color:var(--acc);
  border-right:1px solid #f1d9cf}
.repTitle{font-family:'Cormorant Garamond', serif; font-size:26px; font-weight:600; color:var(--tx);
  line-height:1.2; padding:12px 18px; display:flex; align-items:center; flex:1; word-break:keep-all}
.repKws{display:flex; flex-wrap:wrap; gap:5px; margin:-6px 0 14px}
.repKw{font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:20px; cursor:pointer;
  background:#f2efe9; border:1px solid #e2ddd3; color:#6b6357; font-family:inherit}
.repKw:hover{background:var(--acc); border-color:var(--acc); color:#fff}
.repKw.on{background:var(--acc); border-color:var(--acc); color:#fff}
.repBody{display:flex; gap:20px; align-items:flex-start}
@media (max-width:720px){ .repBody{flex-direction:column} }
.repImg{flex:0 0 300px; border-radius:8px; overflow:hidden}
.repImg img{width:100%; aspect-ratio:4/5; object-fit:cover; display:block; background:#efeae1}
@media (max-width:900px){ .repImg{flex:0 0 220px} }
@media (max-width:720px){ .repImg{flex:0 0 auto; width:100%} .repImg img{aspect-ratio:16/9} }
.repList{list-style:none; margin:0; padding:0; flex:1; display:flex; flex-direction:column; gap:11px}
.repList li{position:relative; padding-left:22px; font-size:12.5px; line-height:1.55; color:var(--tx)}
.repList li::before{content:'✔'; position:absolute; left:0; top:1px; color:var(--acc); font-weight:800; font-size:12px}
.repSrc{display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:.06em; color:var(--sub); text-transform:uppercase; margin-right:6px; vertical-align:baseline}
.repText{color:var(--tx)}
.repLink{display:inline-block; margin-left:6px; font-size:10.5px; font-weight:700; color:var(--acc); text-decoration:none}
.repLink:hover{text-decoration:underline}
.bubbleRow{display:flex; align-items:center; flex-wrap:wrap; gap:10px}
.bubble.on{border-color:var(--acc); box-shadow:0 0 0 2px var(--acc) inset}
.bubble{position:relative; border-radius:50%; background:#fff; border:1px solid var(--hair); display:flex; align-items:center;
  justify-content:center; flex-direction:column; flex-shrink:0; cursor:pointer; transition:border-color .15s; text-align:center; padding:4px}
.bubble .linkdot{position:absolute; top:-5px; right:-5px; font-size:10px; background:#fff; border:1px solid var(--hair);
  border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center}
.bubble:hover{border-color:var(--tx)}
.bubble .bn{font-weight:700; color:var(--tx); line-height:1.2; word-break:keep-word}
.bubble .bc{color:var(--sub)}
.bubble.top{background:var(--tx); border-color:var(--tx)}
.bubble.top .bn, .bubble.top .bc{color:#fff}
.kwgrid{display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:14px; margin-top:14px}
@media (max-width:1100px){ .kwgrid{grid-template-columns:repeat(4, minmax(0, 1fr))} }
@media (max-width:900px){ .kwgrid{grid-template-columns:repeat(3, minmax(0, 1fr))} }
@media (max-width:640px){ .kwgrid{grid-template-columns:repeat(2, minmax(0, 1fr))} }
.kwgrid .kwcard{width:100%; min-width:0; box-sizing:border-box; overflow:hidden}
.kwcard{background:var(--card); border:1px solid var(--hair); border-radius:10px; padding:14px; position:relative;
  display:flex; flex-direction:column}
.kwcard .kwphotowrap{position:relative; width:calc(100% + 28px); margin:-14px -14px 10px; overflow:hidden}
.kwcard .kwphotowrap .authorline{position:absolute; left:0; right:0; bottom:0; height:4px}
.kwcard .kwphoto{width:100%; display:block; aspect-ratio:3/4; object-fit:cover; background:#efeae1;
  border-radius:10px 10px 0 0}
.kwcard .kwdate{position:absolute; top:10px; left:10px; font-size:9px; font-weight:800; color:#fff;
  background:rgba(0,0,0,.55); padding:2px 7px; border-radius:8px; letter-spacing:.02em}
.kwcard .kwregion{position:absolute; top:10px; right:10px; font-size:9px; font-weight:800; color:#fff;
  background:rgba(0,0,0,.55); padding:2px 7px; border-radius:8px}
.kwcard .kwsrc{position:absolute; bottom:10px; right:10px; font-size:9px; font-weight:800; color:#fff;
  background:rgba(0,0,0,.55); padding:2px 7px; border-radius:8px}
/* 펼칠 수 있는 카드 — 박스를 누르면 숨은 사진·전체 설명이 나온다 */
.kwcard.has-more{cursor:pointer}
.kwcard .morebadge{position:absolute; bottom:10px; left:10px; font-size:9px; font-weight:800; color:#fff;
  background:rgba(200,69,31,.85); padding:2px 8px; border-radius:20px; letter-spacing:.02em}
.kwcard .kwmore{display:none; margin-top:10px}
.kwcard.expanded .kwmore{display:block}
.kwcard .kwmoreimgs{display:grid; grid-template-columns:repeat(3, 1fr); gap:6px}
.kwcard .kwmoreimgs img{width:100%; height:118px; object-fit:cover; border-radius:6px; background:#efeae1}
.kwcard .kwmorehint{font-size:9.5px; font-weight:700; color:var(--acc); text-align:center; margin-top:9px; opacity:.8}
.kwcard.has-more .kwmorehint::after{content:'눌러서 전체 보기 ▾'}
.kwcard.has-more.expanded .kwmorehint::after{content:'접기 ▴'}
/* 여러 기사가 묶인 카드 — 사진은 단일 카드와 같은 크기로, 가로로 넘겨봄 */
.kwcard .kwslidewrap{position:relative; width:calc(100% + 28px); margin:-14px -14px 10px}
.kwcard .kwslides{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; scroll-behavior:smooth}
.kwcard .kwslides::-webkit-scrollbar{display:none}
.kwcard .kwnav{position:absolute; top:42%; transform:translateY(-50%); width:28px; height:28px; border-radius:50%;
  background:rgba(0,0,0,.5); color:#fff; border:0; cursor:pointer; font-size:16px; font-weight:700; line-height:1;
  display:flex; align-items:center; justify-content:center; z-index:2; padding:0; font-family:inherit}
.kwcard .kwnav:hover{background:rgba(0,0,0,.75)}
.kwcard .kwnav.prev{left:8px}
.kwcard .kwnav.next{right:8px}
.kwcard .kwslide{position:relative; flex:0 0 100%; scroll-snap-align:start}
.kwcard .kwslide img{width:100%; display:block; aspect-ratio:3/4; object-fit:cover; background:#efeae1}
.kwcard .kwslide:first-child img{border-radius:10px 0 0 0}
.kwcard .kwslide:last-child img{border-radius:0 10px 0 0}
.kwcard .kwslide .authorline{position:absolute; left:0; right:0; bottom:0; height:4px}
.kwcard .kwdots{position:absolute; left:0; right:0; bottom:12px; display:flex; justify-content:center; gap:6px; z-index:2}
.kwcard .kwdot{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.5); cursor:pointer;
  box-shadow:0 0 0 1px rgba(0,0,0,.2); transition:background .15s, transform .15s}
.kwcard .kwdot.on{background:#fff; transform:scale(1.25)}
/* 묶임 표시 — 왼쪽 세로선과 가지로 "이 기사들이 한 키워드로 묶였다"를 나타냄 */
.kwcard .grouphead{font-size:9.5px; font-weight:800; color:var(--acc); letter-spacing:.03em; margin:8px 0 6px;
  display:flex; align-items:center; gap:3px}
.fire{font-size:17px; line-height:1}
.imgfail{background:#efeae1 !important; position:relative}
.imgfail::after{content:'원문 매체가 이미지 사용을 제한합니다'; position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center; text-align:center; padding:0 14px;
  font-size:10px; font-weight:600; color:#a99f90; line-height:1.5}
.bubble .fire{font-size:19px; line-height:1; margin-bottom:1px}
.bubble .bubbleMore{position:absolute; bottom:-6px; right:-6px; width:22px; height:22px;
  background:#fff; border:1px solid var(--hair); border-radius:50%; font-size:12px; line-height:1;
  color:var(--sub); cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center;
  opacity:.75; transition:opacity .15s, background .15s, color .15s; z-index:2}
.bubble .bubbleMore:hover{opacity:1; background:var(--tx); color:#fff; border-color:var(--tx)}
/* 클러스터 상세 모달 */
.cmOverlay{position:fixed; inset:0; background:rgba(28,26,22,.55); z-index:1000; overflow:auto;
  padding:40px 20px; display:flex; align-items:flex-start; justify-content:center}
.cmBox{background:#fff; max-width:1100px; width:100%; border-radius:14px; padding:28px 28px 32px;
  position:relative; box-shadow:0 20px 60px rgba(0,0,0,.25)}
.cmClose{position:absolute; top:14px; right:14px; width:32px; height:32px; border:none; background:transparent;
  font-size:22px; cursor:pointer; color:var(--sub); border-radius:50%; line-height:1}
.cmClose:hover{background:#f4efe6; color:var(--tx)}
.cmHead{font-family:'Cormorant Garamond', serif; font-size:38px; font-weight:600; color:var(--tx); margin-bottom:4px}
.cmSub{font-size:12px; color:var(--sub); margin-bottom:14px}
.cmChips{display:flex; flex-wrap:wrap; gap:6px; padding-bottom:18px; border-bottom:1px solid var(--hair); margin-bottom:20px}
.cmMergeBar{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:0 0 18px; padding:10px 12px;  background:#faf6f2; border:1px solid var(--hair); border-radius:10px}
.cmMergeBar .cmMergeLabel{font-size:11px; font-weight:800; color:var(--acc)}
.cmMergeBar input{font:inherit; font-size:12px; border:1px solid var(--hair); border-radius:8px; padding:5px 9px; background:#fff}
.cmMergeBar .cmMergeFrom{flex:1; min-width:220px}
.cmMergeBar .cmMergeTo{width:150px}
.cmMergeBar .cmMergeArrow{font-weight:800; color:var(--sub)}
.cmMergeBar .go{border:0; background:var(--acc); color:#fff; font-weight:800; font-size:12px; border-radius:8px; padding:6px 14px; cursor:pointer}
.cmMergeBar .cmMergeMsg{flex-basis:100%}
/* 대표어 관리 버튼 & 모달 */
.aliasManageBtn{border:1px solid var(--hair)!important; background:#fff!important;
  color:var(--sub)!important; border-radius:20px; padding:4px 12px; font-size:11px; font-weight:700; cursor:pointer}
.aliasManageBtn:hover{border-color:var(--acc)!important; color:var(--acc)!important}
.aliasNew{display:flex; gap:8px; flex-wrap:wrap; align-items:center}.aliasNew input{flex:1; min-width:160px; font:inherit; font-size:12.5px; border:1px solid var(--hair);
  border-radius:9px; padding:7px 10px; background:#fff}
.aliasNew .go{border:0; background:var(--acc); color:#fff; font-weight:800; font-size:12px;
  border-radius:9px; padding:8px 16px; cursor:pointer}
.aliasGroup{border:1px solid var(--hair); border-radius:12px; padding:11px 13px; margin-bottom:10px; background:#fff}
.aliasGroupHead{display:flex; align-items:center; gap:10px; margin-bottom:8px}
.aliasCanon{font-weight:800; font-size:14px; color:var(--acc)}
.aliasDelGroup{margin-left:auto; border:1px solid var(--hair); background:none; color:var(--sub);
  font-size:10.5px; font-weight:700; border-radius:20px; padding:3px 10px; cursor:pointer}
.aliasDelGroup:hover{border-color:var(--rising); color:var(--rising)}
.aliasVars{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.aliasVar{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:#6b6357;
  background:#f2efe9; border:1px solid #e2ddd3; border-radius:20px; padding:3px 6px 3px 10px}
.aliasVar button{border:0; background:#ddd6ca; color:#fff; width:15px; height:15px; border-radius:50%;
  font-size:9px; line-height:1; cursor:pointer}
.aliasVar button:hover{background:var(--rising)}
.aliasAddVar{display:inline-flex; gap:4px; align-items:center}
.aliasAddVar input{font:inherit; font-size:11.5px; border:1px solid var(--hair); border-radius:20px;
  padding:3px 10px; width:110px; background:#fff}
.aliasAddVar button{border:1px solid var(--hair); background:#fff; color:var(--acc); font-weight:800;
  width:24px; height:24px; border-radius:50%; cursor:pointer}
.aliasAddVar button:hover{border-color:var(--acc)}
/* 전체 태그 목록 + 선택 묶기 */
.aliasSelBar{display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:9px 12px; margin-bottom:10px;
  background:#fbeee7; border:1px solid #f1d9cf; border-radius:10px; font-size:12px}
.aliasSelBar .aliasSelArrow{color:var(--sub); font-weight:700}
.aliasSelBar select, .aliasSelBar input{font:inherit; font-size:12px; border:1px solid var(--hair); border-radius:8px; padding:5px 9px; background:#fff}
.aliasSelBar .aliasSelNew{width:150px}
.aliasSelBar .go{border:0; background:var(--acc); color:#fff; font-weight:800; border-radius:8px; padding:6px 15px; cursor:pointer}
.aliasSelBar .aliasSelClear{border:1px solid var(--hair); background:#fff; color:var(--sub); border-radius:8px; padding:5px 11px; cursor:pointer}
.aliasModalPanel{display:flex; flex-direction:column; max-height:88vh; overflow:hidden}
.aliasModalPanel .aliasFixed{flex:0 0 auto}
.aliasModalPanel .aliasGroupsWrap{flex:1 1 auto; overflow-y:auto; min-height:120px; padding-right:4px}
.aliasModalPanel .aliasGroupsHead{position:sticky; top:0; background:var(--card,#fbf8f2); padding-top:4px; z-index:1}
.aliasTagList{display:flex; flex-wrap:wrap; gap:6px; max-height:230px; overflow:auto;
  border:1px solid var(--hair); border-radius:10px; padding:10px; background:#fdfcfa}
.aliasTag{display:inline-flex; align-items:center; gap:6px; font-size:12px; cursor:pointer;
  background:#fff; border:1px solid var(--hair); border-radius:20px; padding:4px 10px 4px 8px; user-select:none}
.aliasTag:hover{border-color:var(--acc)}
.aliasTag.on{background:#fbeee7; border-color:var(--acc)}
.aliasTag input{margin:0; accent-color:var(--acc)}
.aliasTagName{font-weight:600; color:var(--tx)}
.aliasTagCnt{font-size:10px; font-weight:700; color:#fff; background:#c3bbae; border-radius:20px; padding:1px 7px}
.aliasTag.on .aliasTagCnt{background:var(--acc)}
.aliasTagBadge.rep{font-size:8.5px; font-weight:800; color:#fff; background:var(--acc); border-radius:20px; padding:1px 6px; letter-spacing:.03em}
.aliasTop2{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.aliasAuto{border:1px solid var(--acc); background:#fff; color:var(--acc); font-weight:800; font-size:12px;
  border-radius:20px; padding:6px 14px; cursor:pointer; white-space:nowrap}
.aliasAuto:hover{background:var(--acc); color:#fff}
.aliasTag[draggable]{cursor:grab}
.aliasTag.drophot, .aliasGroup.drophot{outline:2px dashed var(--acc); outline-offset:2px; background:#fbeee7}
.cmChip{cursor:pointer}
.cmChip:hover{outline:2px solid var(--acc); outline-offset:1px}
.cmEditBar{font-size:11px; color:var(--sub); margin:6px 0 14px}
.cmEditBox{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:8px 0 14px;
  padding:10px 12px; border:1px solid #f1d9cf; border-radius:10px; background:#fffdfb}
.cmEditBox input{border:1px solid var(--hair); border-radius:6px; padding:6px 9px; font:inherit; font-size:12px; min-width:160px}
.cmEditBox button{font-size:11px; font-weight:800; padding:6px 12px; border-radius:20px; cursor:pointer;
  border:1px solid var(--hair); background:#fff; color:var(--tx); font-family:inherit}
.cmEditBox button.go{background:var(--acc); border-color:var(--acc); color:#fff}
.cmEditBox button.del{color:var(--acc)}
.cmChip{font-size:11px; font-weight:600; padding:3px 10px; border-radius:20px; background:#f4efe6; color:var(--tx)}
.cmChip.head{background:var(--tx); color:#fff}
.cmChipMini{font-size:10px; padding:1px 7px; border-radius:20px; background:#f4efe6; color:var(--sub); margin-right:3px; display:inline-block; margin-bottom:2px}
.cmGrid{display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:14px}
@media (max-width:900px){ .cmGrid{grid-template-columns:repeat(3, minmax(0, 1fr))} }
@media (max-width:640px){ .cmGrid{grid-template-columns:repeat(2, minmax(0, 1fr))} }
.cmCard{background:var(--card,#fff); border:1px solid var(--hair); border-radius:10px; overflow:hidden; display:flex; flex-direction:column}
.cmCard img{width:100%; aspect-ratio:1; object-fit:cover; display:block}
.cmCardBody{padding:12px}
.cmMatchBadge{display:inline-block; font-size:10px; font-weight:700; color:var(--acc); background:#fdf3ef; padding:2px 7px; border-radius:9px; margin-bottom:6px}
.cmCardTitle{font-weight:700; font-size:13px; margin-bottom:5px; line-height:1.35}
.cmCardText{font-size:11px; color:var(--sub); line-height:1.5; margin-bottom:8px}
.cmCardTags{display:flex; flex-wrap:wrap; gap:3px; margin-bottom:8px}
.cmCardLink{font-size:11px; font-weight:600; color:var(--acc); text-decoration:none}
.cmCardLink:hover{text-decoration:underline}
/* 다른 카테고리 관련 트렌드 (사진 없이 텍스트+링크만) */
.cmRelSec{margin-top:34px; padding-top:24px; border-top:1px solid var(--hair)}
.cmRelHead{font-family:'Cormorant Garamond', serif; font-size:22px; font-weight:600; color:var(--tx); margin-bottom:2px}
.cmRelSub{font-size:11px; color:var(--sub); margin-bottom:16px}
.cmRelGroups{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:22px}
@media (max-width:900px){ .cmRelGroups{grid-template-columns:repeat(2, minmax(0, 1fr))} }
@media (max-width:640px){ .cmRelGroups{grid-template-columns:1fr} }
.cmRelGroup{background:#faf7f2; border-radius:8px; padding:12px 14px}
.cmRelCat{font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--acc); margin-bottom:8px}
.cmRelList{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.cmRelList li{font-size:12px; line-height:1.4; padding-bottom:6px; border-bottom:1px dashed var(--hair)}
.cmRelList li:last-child{border-bottom:0; padding-bottom:0}
.cmRelList a{color:var(--tx); text-decoration:none; font-weight:600}
.cmRelList a:hover{color:var(--acc); text-decoration:underline}
.cmRelList span{color:var(--tx); font-weight:600}
.cmRelTags{display:block; font-size:9.5px; color:var(--sub); font-weight:400; margin-top:2px; letter-spacing:.02em}
.kwcard .grouplist{margin-left:4px; padding-left:11px; border-left:2px solid var(--acc);
  display:flex; flex-direction:column; gap:9px}
.kwcard .groupitem{position:relative}
.kwcard .groupitem::before{content:''; position:absolute; left:-11px; top:7px; width:7px; height:2px; background:var(--acc)}
.kwcard .groupitem .gtxt{font-size:10.5px; color:var(--sub); line-height:1.45; margin-bottom:3px}
.kwcard .groupitem .gmeta{font-size:9px; color:var(--sub); opacity:.8; margin-top:2px}
.ovPeriod{display:inline-block; vertical-align:middle; margin-left:10px; font-family:'Noto Sans KR', sans-serif;
  font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--acc);
  background:#fdf3ef; border:1px solid #f1d9cf; padding:3px 10px; border-radius:20px}
.scatterWrap{flex:1 1 100%; width:100%; padding:4px 0 2px}
.scatterScroll{padding-bottom:4px}
.scatterTop{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:4px}
.yToggle{display:inline-flex; border:1px solid var(--tx); border-radius:20px; overflow:hidden}
.yToggle button{border:0; background:#fff; color:var(--sub); padding:4px 14px; cursor:pointer;
  font-family:inherit; font-size:10.5px; font-weight:800; letter-spacing:.03em}
.yToggle button + button{border-left:1px solid var(--hair)}
.yToggle button.on{background:var(--tx); color:#fff}
circle.sc{transition:fill-opacity .15s}
circle.sc:hover{fill-opacity:.8}
.snsWrap{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px; align-items:start}
.snsWrap .snsStyle{margin-bottom:0}
@media (max-width:760px){ .snsWrap{grid-template-columns:1fr} }
.snsMore{margin-top:8px; font-size:11px; font-weight:800; color:var(--sub); background:none;
  border:1px solid var(--hair); border-radius:20px; padding:4px 12px; cursor:pointer; font-family:inherit}
.snsMore:hover{border-color:var(--acc); color:var(--acc)}
.snsStyle{border:1px solid var(--hair); border-radius:12px; padding:16px 18px; margin-bottom:14px; background:var(--card)}
.snsStyle header{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px}
.snsStyle h4{font-size:15px; font-weight:800; margin:0}
.snsSub{font-size:11.5px; font-weight:800; color:var(--sub); letter-spacing:.05em; margin:12px 0 6px}
.snsRow{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px}
.snsShot{margin:0}
.snsShot img{width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:8px; background:#efeae1; display:block}
.snsShot figcaption{font-size:10.5px; color:var(--sub); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.snsShot figcaption a{color:var(--sub); text-decoration:none}
.snsShot figcaption a:hover{color:var(--acc); text-decoration:underline}
/* 메인 대표 3장 그리드 + 박스 클릭 → 팝업 */
.snsCover{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px}
.snsRegion{display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:.04em; color:#fff;
  background:#8d9aa8; padding:2px 8px; border-radius:20px; vertical-align:middle}
/* 사진마다 표시하는 시장 뱃지 */
.snsCoverCell{position:relative; margin:0}
.snsCoverCap{font-size:10px; color:var(--sub); margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.snsCoverCap a{color:var(--sub); text-decoration:none}
.snsCoverCap a:hover{color:var(--acc); text-decoration:underline}
.snsShotRegion{position:absolute; top:5px; left:5px; z-index:1; font-size:9px; font-weight:800; letter-spacing:.03em;
  color:#fff; background:rgba(0,0,0,.6); padding:2px 6px; border-radius:6px}
.snsShotSource{position:absolute; top:5px; right:5px; z-index:1; font-size:8.5px; font-weight:800; letter-spacing:.02em;
  color:#fff; background:rgba(140,69,31,.72); padding:2px 6px; border-radius:6px; max-width:66%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.snsCoverImg{width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:8px; background:#efeae1; display:block}
.snsStyle.clickable{cursor:pointer}
.snsNote{font-size:11.5px; color:var(--sub); line-height:1.5; margin:2px 0 8px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.snsExpandHint{font-size:10px; font-weight:700; color:var(--acc); text-align:center; margin-top:10px; opacity:.8}
.snsStyle.clickable .snsExpandHint::after{content:'눌러서 크게 보기 ⤢'}
/* SNS 팝업(모달) */
.snsModal{position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:24px}
.snsModalBack{position:absolute; inset:0; background:rgba(30,26,20,.55)}
.snsModalPanel{position:relative; background:var(--card, #fff); border-radius:16px; width:min(1100px, 96vw);
  max-height:90vh; overflow:auto; padding:22px 24px 26px; box-shadow:0 20px 60px rgba(0,0,0,.3)}
.snsModalX{position:absolute; top:14px; right:16px; width:30px; height:30px; border-radius:50%; border:1px solid var(--hair);
  background:#fff; color:var(--sub); font-size:14px; cursor:pointer}
.snsModalX:hover{border-color:var(--acc); color:var(--acc)}
.snsModalHead{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:0 34px 10px 0}
.snsModalHead h3{font-size:19px; font-weight:800; margin:0}
.snsModalTitleInput{font-size:19px; font-weight:800; color:var(--tx); border:1px solid transparent;
  border-radius:8px; padding:3px 8px; margin:-3px -8px; background:transparent; min-width:200px; max-width:70%}
.snsModalTitleInput:hover{border-color:var(--hair)}
.snsModalTitleInput:focus{border-color:var(--acc); background:#fff; outline:none}
.snsModalDesc{display:flex; gap:8px; align-items:flex-start; margin-bottom:16px}
.snsModalDesc textarea{flex:1; font:inherit; font-size:12.5px; line-height:1.5; color:var(--tx);
  border:1px solid var(--hair); border-radius:10px; padding:8px 10px; resize:vertical; background:#fff}
.snsModalGrid{display:grid; grid-template-columns:repeat(4, 1fr); gap:12px}
.snsModalFilter{display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 14px}
.snsModalFilter button{font:inherit; font-size:11px; font-weight:700; border:1px solid var(--hair); background:#fff;
  color:var(--sub); border-radius:20px; padding:4px 13px; cursor:pointer}
.snsModalFilter button.on{background:var(--acc); color:#fff; border-color:var(--acc)}
@media(max-width:820px){ .snsModalGrid{grid-template-columns:repeat(3, 1fr)} }
@media(max-width:520px){ .snsModalGrid{grid-template-columns:repeat(2, 1fr)} }
.snsMShot{margin:0; position:relative}
.snsMShot img{width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; background:#efeae1; display:block}
.snsMShot figcaption{font-size:10.5px; color:var(--sub); margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.snsMShot figcaption a{color:var(--sub); text-decoration:none}
.snsMShot figcaption a:hover{color:var(--acc); text-decoration:underline}
/* 순서 편집 툴바 */
.snsTools{display:inline-flex; gap:6px; margin-left:auto}
.snsToolBtn{font-size:10.5px; font-weight:800; color:var(--sub); background:#fff; border:1px solid var(--hair);
  border-radius:20px; padding:3px 12px; cursor:pointer}
.snsToolBtn:hover{border-color:var(--acc); color:var(--acc)}
.snsToolBtn.primary{background:var(--acc); border-color:var(--acc); color:#fff}
/* 편집 모드 */
.snsStyle.editing{cursor:default; outline:1px dashed transparent}
.snsStyle.editing.dragging{opacity:.4}
.snsStyle.editing.dragover{outline-color:var(--acc)}
.snsStyle .dragdot{font-size:13px; color:var(--sub); cursor:grab; margin-right:2px; user-select:none}
.snsEditGrid{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:8px}
@media(max-width:900px){ .snsEditGrid{grid-template-columns:repeat(3, 1fr)} }
.snsEditShot{position:relative; margin:0; cursor:grab}
.snsEditShot.dragging{opacity:.4}
.snsEditShot.dragover{outline:2px solid var(--acc); outline-offset:1px; border-radius:8px}
.snsEditShot img{width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:8px; background:#efeae1; display:block; pointer-events:none}
.snsEditShot figcaption{font-size:9px; color:var(--sub); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.coverStar{position:absolute; top:5px; left:5px; width:22px; height:22px; border-radius:50%; border:0;
  background:rgba(0,0,0,.5); color:#fff; font-size:12px; line-height:22px; cursor:pointer; padding:0}
.snsEditShot.iscover .coverStar{background:var(--acc); color:#fff}
.snsEditShot.iscover img{outline:2px solid var(--acc); outline-offset:-2px; border-radius:8px}
.snsEditNote{font-size:10px; color:var(--sub); margin:2px 0 10px}
.bubbleTabs{display:flex; gap:4px; margin:2px 0 8px; justify-content:flex-start; align-items:center; flex-wrap:wrap}
.bubbleTabs button{font-size:10px; font-weight:800; letter-spacing:.03em; padding:4px 11px; border-radius:20px;
  background:#f2efe9; border:1px solid #e2ddd3; color:#6b6357; cursor:pointer; font-family:inherit}
.bubbleTabs button.on{background:var(--tx); border-color:var(--tx); color:#fff}
.scg{transition:transform .13s ease}
.scg:hover{transform:scale(1.09)}
.sc{transition:fill-opacity .13s ease}
.flowToggle{margin-left:6px; border:1px solid var(--acc)!important; background:#fff!important; color:var(--acc)!important}
.flowToggle.on{background:var(--acc)!important; color:#fff!important}
.scatterTop{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px}
.runwaySeasonTabs{display:flex; gap:6px; margin:10px 0 14px; flex-wrap:wrap}
.runwaySeasonTabs button{font-size:12px; font-weight:800; letter-spacing:.02em; padding:6px 14px; border-radius:20px;
  border:1px solid var(--hair); background:#fff; color:var(--sub); cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.runwaySeasonTabs button.on{background:var(--tx); border-color:var(--tx); color:#fff}
.runwaySeasonTabs .rwCnt{font-size:10px; font-weight:700; background:rgba(0,0,0,.12); border-radius:10px; padding:0 6px}
.runwaySeasonTabs button.on .rwCnt{background:rgba(255,255,255,.25)}
.rwBrand{margin:0 0 20px}
.rwBrandName{font-size:14px; font-weight:800; color:var(--tx); margin:0 0 8px; letter-spacing:.02em}
.rwBrandName .rwBrandN{font-size:11px; font-weight:700; color:var(--sub); margin-left:4px}
.rwShots{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px}
.rwShot{display:block; aspect-ratio:3/4; border-radius:12px; overflow:hidden; border:1px solid var(--hair); background:#f4efe7}
.rwShot img{width:100%; height:100%; object-fit:cover; display:block}
.flowTopn{margin-left:auto; font-size:11px; color:var(--sub); font-weight:700; display:inline-flex; align-items:center; gap:4px}
.flowTopn select{font:inherit; font-size:11px; border:1px solid var(--hair); border-radius:7px; padding:2px 6px; background:#fff}
.kwcard .kwname{font-size:15px; font-weight:800; margin-bottom:4px; line-height:1.3}
.kwcard .kwmeta{font-size:10.5px; color:var(--acc); font-weight:700; margin-bottom:8px}
.kwcard .kwex{font-size:11px; color:var(--sub); line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.kwcard.expanded .kwex{-webkit-line-clamp:unset; overflow:visible}
.kwcard a.kwlink{font-size:10.5px; font-weight:700; color:var(--acc); text-decoration:none; display:inline-block; margin-top:6px}
.kwcard .volbar{height:5px; border-radius:3px; background:#f3ede3; overflow:hidden; margin:8px 0}
.kwcard .volbar i{display:block; height:100%; border-radius:3px; background:var(--acc)}
.kwcard .kwauthor{font-size:9px; font-weight:800; letter-spacing:.04em; margin-top:-2px; margin-bottom:2px}
.kwcard .kwsubrow{display:flex; gap:8px; overflow-x:auto; margin-top:8px; padding-bottom:2px; scrollbar-width:thin}
.kwcard .kwsubrow::-webkit-scrollbar{height:5px}
.kwcard .kwsubrow::-webkit-scrollbar-thumb{background:var(--hair); border-radius:3px}
.kwcard .kwsub{flex:0 0 128px; background:#faf7f2; border:1px solid var(--hair); border-radius:8px; padding:8px}
.kwcard .kwsubimg{width:100%; height:72px; object-fit:cover; border-radius:6px; margin-bottom:6px; background:#efeae1; display:block}
.kwcard .kwsubauthor{font-size:9px; font-weight:800; letter-spacing:.04em; margin-bottom:3px}
.kwcard .kwsubtxt{font-size:10px; color:var(--sub); line-height:1.4; margin-bottom:4px}
.kwcard.hot{border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset}
.kwcard.hot .volbar{height:7px}
.kwcard .tagrow{display:flex; flex-wrap:wrap; gap:4px; margin-top:7px}
.kwcard .tagchip{font-size:9px; font-weight:700; letter-spacing:.02em; padding:2px 7px; border-radius:20px;
  background:#f2efe9; border:1px solid #e2ddd3; color:#6b6357; cursor:pointer; white-space:nowrap}
.kwcard .tagchip:hover{background:var(--acc); border-color:var(--acc); color:#fff}
.kwcard .tagchip.on{background:var(--acc); border-color:var(--acc); color:#fff}
.kwcard .tagedit{font-size:10px; font-weight:700; padding:2px 6px; border-radius:20px;
  background:transparent; border:1px dashed var(--hair); color:var(--sub); cursor:pointer; opacity:.55; transition:opacity .15s}
.kwcard .tagedit:hover{opacity:1; color:var(--tx); border-color:var(--tx)}
.kwcard .relbadge{display:block; width:100%; margin-top:6px; background:#fdf3ef; border:1px solid #f1d9cf; color:var(--acc);
  font-size:10px; font-weight:700; padding:5px 8px; border-radius:8px; cursor:pointer; text-align:left; font-family:inherit;
  box-sizing:border-box; white-space:normal; overflow-wrap:anywhere; word-break:break-word; line-height:1.35}
.kwcard .relmore{display:block; margin-top:5px; font-size:9.5px; font-weight:700; color:var(--sub);
  background:none; border:0; padding:0; cursor:pointer; text-align:left; font-family:inherit}
.kwcard .relbadge:hover{background:#f8e7de}
.kwcard .relbadge.back{background:#eef2fb; border-color:#d6e0f5; color:#3a5bb0}
.kwcard .relbadge.back:hover{background:#e2e9f9}
.morebtn{margin-top:14px; background:none; border:1px solid var(--hair); border-radius:20px; padding:8px 18px; font-size:11px; font-weight:700; cursor:pointer; color:var(--tx)}
.kwlist{margin-top:10px; display:flex; flex-direction:column; gap:6px}
.kwrow{display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border:1px solid var(--hair); border-radius:8px; font-size:11.5px}
.kwrow .kwrank2{color:var(--sub); font-weight:700; width:28px; flex-shrink:0}
.kwrow .kwname2{flex:1}
.kwrow .kwcount2{color:var(--acc); font-weight:700; flex-shrink:0}
.genericNote{font-size:10.5px; color:var(--sub); margin-top:10px}
.srcbadge{display:inline-block; font-size:8.5px; font-weight:800; letter-spacing:.05em; padding:2px 7px; border-radius:8px}
.srcbadge.SNS{background:#e7efe9; color:#1a7a4a}

<script type="module">
console.log("TREND AGENT signal.html v260808-34");
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ══ 설정 — 다른 파일들과 같은 값 ══ */
const SUPABASE_URL  = (window.TA_CONFIG && TA_CONFIG.url)  || 'https://bgyrmztoohrdjkxzylmr.supabase.co';
const SUPABASE_ANON = (window.TA_CONFIG && TA_CONFIG.anon) || 'sb_publishable_JX986aH0CBAEgr7exxvv-g_uGc2Zijm';
/* ═══════════════════════════════ */

const sb = createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = s => document.querySelector(s);
const esc = x => String(x ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = v => String(v||'').toLowerCase().replace(/[\s#_-]/g,'');

/* ══ 정적 데이터 — 예전 trend-agent2 Supabase에서 이관 (2026-07 기준, 하드코딩) ══ */
const FASHION_SIG = [];
const LIFESTYLE_SIG = [];
let SNS_VIRAL = [];
const CAT_LABEL = {top:'상의',outer:'아우터',pants:'팬츠',shoes:'슈즈',acc:'액세서리',dress:'스커트 & 드레스',bag:'백',etc:'컬러',lifestyle:'라이프스타일'};
const AUTHOR_COLOR = { jisoo:'#c8451f', jin:'#b19cd9', sohee:'#4a6fb5' };

/* 서로 다른 작성자가 몇 명인지 — 2명 이상이면 여러 사람이 같은 트렌드를 잡았다는 뜻 */
function authorCount(items){
  return new Set((items || []).map(it => it && it.author).filter(Boolean)).size;
}

/* 막대바 색 — 작성자가 한 명이면 그 색, 여러 명이면 건수 비율대로 나눠 칠함 */
function authorBarColor(items){
  const counts = new Map();
  for(const it of (items || [])){
    if(!it || !it.author) continue;
    counts.set(it.author, (counts.get(it.author) || 0) + 1);
  }
  if(!counts.size) return 'var(--acc)';
  const list = [...counts.entries()];
  if(list.length === 1) return AUTHOR_COLOR[list[0][0]] || 'var(--acc)';
  const total = list.reduce((a, [, n]) => a + n, 0);
  let at = 0;
  const stops = list.map(([name, n]) => {
    const from = at, to = at + (n / total) * 100;
    at = to;
    const c = AUTHOR_COLOR[name] || 'var(--acc)';
    return `${c} ${from.toFixed(2)}%, ${c} ${to.toFixed(2)}%`;
  }).join(', ');
  return `linear-gradient(90deg, ${stops})`;
}

/* ── SNS 바이럴 구글시트 실시간 연동 (SHEET_VIRAL) ── */
const SHEET_VIRAL_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS-uKmAPEaO-ee3-Du5iIPFBIQTdVDYbkYJG3fjl_XWKA6vxPHqHzy2kEQjwobfs4a2QOxUuHpMCce/pub?output=csv';

function parseCSV(text){
  const rows = []; let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\r'){ /* skip */ }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  const header = rows.shift() || [];
  return rows.filter(r => r.length > 1 || r[0]).map(r => {
    const obj = {}; header.forEach((h,i) => obj[h] = r[i] ?? ''); return obj;
  });
}

function numKR(v){
  if (v == null) return 0;
  v = String(v).replace(/,/g,'').trim();
  if (v === '' || v === '-') return 0;
  const n = parseInt(v, 10);
  return isNaN(n) ? 0 : n;
}

function mapSnsRow(r){
  return {
    rank: numKR(r['순위']), content: (r['콘텐츠']||'').trim(), cat: (r['중분류']||'').trim(),
    subcat: (r['세부분류']||'').trim(), ad: (r['광고유형']||'').trim(), brand: (r['브랜드']||'').trim(),
    product: (r['제품명']||'').trim(), retailer: (r['유통사']||'').trim(), account: (r['계정/채널']||'').trim(),
    followers: numKR(r['팔로워 수']), score: numKR(r['스코어']), views: numKR(r['조회수']),
    likes: numKR(r['좋아요 수']), comments: numKR(r['댓글 수']),
    account_url: (r['계정 링크']||'').trim(), post_url: (r['게시물 링크']||'').trim(),
  };
}

/* 실패해도 조용히 하드코딩된 시드 데이터로 유지 — 시트 연동 성공 시에만 교체 후 재렌더 */
async function loadSnsSheet(){
  try {
    const res = await fetch(SHEET_VIRAL_URL);
    if (!res.ok) throw new Error('sheet fetch failed: ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text).map(mapSnsRow).filter(r => r.content);
    if (rows.length){ SNS_VIRAL = rows; renderStatic(); }
  } catch (e) {
    console.warn('SNS 시트 실시간 연동 실패 — 하드코딩된 샘플 데이터 유지:', e);
  }
}

let ENTS = [], SIG = [], CNT = {}, COVER = {}, TAGS = [];
const _thisYm = new Date().toISOString().slice(0,7);
let monthStart = _thisYm, monthEnd = _thisYm;   /* 월 범위 필터 — 처음엔 이번 달 */
let month = _thisYm;   /* 예전 API 호환용 (사용하는 곳이 있어서 남김) */
let catF = 'All', brandF = 'All';

const SRC_PRI = ['instagram','naver','sometrend','naver_blog','community','google','manual'];
const sigOf = (eid, region, srcOnly) => {
  const all = SIG.filter(s => s.entity_id === eid && (!region || s.region === region));
  if(srcOnly) return all.filter(r => r.source === srcOnly).sort((a,b) => a.week.localeCompare(b.week));
  const src = SRC_PRI.find(x => all.filter(r => r.source === x).length >= 2) || all[0]?.source;
  return all.filter(r => r.source === src).sort((a,b) => a.week.localeCompare(b.week));
};
const MEDIA = [['instagram','인스타그램','#c8451f'],['youtube','유튜브','#8a2be2'],
               ['naver_blog','네이버 블로그','#1a7a4a'],['community','커뮤니티','#4a6fb5']];
const LINE5 = ['#c8451f','#1a7a4a','#4a6fb5','#8a2be2','#b8860b'];

/* 여러 계열 멀티라인 차트 */
function multiLine(series, w=560, h=150){
  const S = series.filter(x => x.rows.length >= 2);
  if(!S.length) return '<div class="empty">데이터가 아직 없습니다 — 수집 탭에서 CSV 를 올리거나 검색량 갱신을 돌려주세요</div>';
  const weeks = [...new Set(S.flatMap(x => x.rows.map(r => r.week)))].sort();
  const mx = Math.max(...S.flatMap(x => x.rows.map(r => +r.volume)), 1);
  const X = wk => 34 + weeks.indexOf(wk) / Math.max(weeks.length-1,1) * (w-44);
  const Y = v => h-18 - (v/mx)*(h-30);
  const grid = [0,.5,1].map(f => `<line x1="34" x2="${w-10}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="var(--hair)"/>` +
    `<text x="30" y="${Y(mx*f)+3}" text-anchor="end" font-size="8" fill="var(--sub)">${Math.round(mx*f)}</text>`).join('');
  const lines = S.map(x => `<polyline fill="none" stroke="${x.color}" stroke-width="1.8"
      points="${x.rows.map(r=>`${X(r.week).toFixed(1)},${Y(+r.volume).toFixed(1)}`).join(' ')}"/>`).join('');
  const xlabels = weeks.filter((_,i) => i % Math.ceil(weeks.length/6) === 0)
    .map(wk => `<text x="${X(wk)}" y="${h-4}" font-size="8" fill="var(--sub)" text-anchor="middle">${wk.slice(5)}</text>`).join('');
  const legend = S.map(x => `<span style="font-size:10px;margin-right:12px"><span style="display:inline-block;width:16px;height:3px;background:${x.color};vertical-align:middle;margin-right:4px"></span>${esc(x.name)}</span>`).join('');
  return `<div style="margin-bottom:4px">${legend}</div><svg width="${w}" height="${h}" style="max-width:100%">${grid}${lines}${xlabels}</svg>`;
}
const pct = (a,b) => b ? Math.round((a-b)/b*100) : null;

/* 최근 4주 vs 이전 4주 */
function change4(eid, region){
  const rows = sigOf(eid, region); if(rows.length < 2) return null;
  const last8 = rows.slice(-8);
  const prev = last8.slice(0, Math.max(0, last8.length-4)).reduce((s,x)=>s+ +x.volume, 0);
  const cur  = last8.slice(-4).reduce((s,x)=>s+ +x.volume, 0);
  if(!prev) return null;
  return pct(cur, prev);
}
const chgHtml = v => v == null ? '<span class="fl">—</span>'
  : v > 3 ? `<span class="up">▲ +${v}%</span>` : v < -3 ? `<span class="dn">▼ ${v}%</span>` : `<span class="fl">${v}%</span>`;

function spark(eid, region, w=150, h=34){
  const rows = sigOf(eid, region).slice(-16);
  if(rows.length < 2) return '<span class="fl">—</span>';
  const vs = rows.map(r => +r.volume), mx = Math.max(...vs, 1), mn = Math.min(...vs, 0);
  const pts = vs.map((v,i) => `${(i/(vs.length-1)*w).toFixed(1)},${(h-3-(v-mn)/(mx-mn||1)*(h-6)).toFixed(1)}`).join(' ');
  const up = vs[vs.length-1] >= vs[0];
  return `<svg class="spark" width="${w}" height="${h}"><polyline points="${pts}" fill="none"
    stroke="${up?'#1a7a4a':'#c8451f'}" stroke-width="1.6"/></svg>`;
}

function stageOf(eid){
  const c = change4(eid,'KR') ?? change4(eid,'GL');
  const rows = sigOf(eid);
  if(!rows.length) return 'New';
  if(c != null && c > 10) return 'Rising';
  if(c != null && c < -15) return 'DESCEND';
  return 'New';
}

async function load(){
  const since = new Date(Date.now() - 62*86400e3).toISOString();
  const [e2, s2, c2, ae, tg, dk] = await Promise.all([
    sb.from('entities').select('entity_id,name_kr,name_en,axis,category_l1,brand_fit,notes,proposal,first_seen,pinned,parent_movement,status'),
    sb.from('search_signals').select('*').order('week'),
    sb.from('v_entity_source_count').select('*'),
    sb.from('asset_entities').select('entity_id,role,images(thumb_url,is_celeb,celeb_name,account,category)').limit(1500),
    sb.from('asset_tags').select('tag_value, images!inner(created_at)').gte('images.created_at', since).limit(1000),
    sb.from('documents').select('keywords,created_at').gte('created_at', since).not('keywords','is',null).limit(400)
  ]);
  ENTS = (e2.data||[]).filter(x => x.status !== 'Archived' && x.axis !== 'movement');
  SIG = s2.data || [];
  CNT = Object.fromEntries((c2.data||[]).map(r => [r.entity_id, r.source_count]));
  COVER = {}; window.LOOKS = {}; window.ECAT = {};
  const catVote = {};
  for(const r of (ae.data||[])){
    if(r.images?.category){
      const cv = catVote[r.entity_id] ||= {};
      cv[r.images.category] = (cv[r.images.category]||0) + 1;
    }
    if(!r.images?.thumb_url) continue;
    COVER[r.entity_id] ||= r.images.thumb_url;
    (window.LOOKS[r.entity_id] ||= []).push(r.images);
  }
  for(const [eid2, cv] of Object.entries(catVote))
    window.ECAT[eid2] = Object.entries(cv).sort((a,b)=>b[1]-a[1])[0][0];
  /* 사전에 없는 #태그 — 피드에서만 잡힌 표현. 등록해야 검색량 추적이 시작됩니다 */
  const entNorms = new Set(ENTS.flatMap(e => [norm(e.name_kr), norm(e.name_en||'')]));
  const tagCnt = {};
  const feedTag = t => { const k = norm(t); if(!k || entNorms.has(k)) return;
    (tagCnt[k] ||= { text: String(t).replace(/^#/,'').replace(/_/g,' '), n: 0 }).n++; };
  for(const r of (tg.data||[])) feedTag(r.tag_value);
  for(const r of (dk.data||[])) for(const k of (r.keywords||[])) feedTag(k);
  TAGS = Object.values(tagCnt).sort((a,b)=>b.n-a.n).slice(0, 40);

  /* 월 선택 목록은 trend_signals(발행일) 기준으로 loadTrendSignals()에서 만듦 — 여기서는 만들지 않음 */
  draw();
}
/* 월 범위 변경: 시작 > 종료면 자동 정렬. 값 바뀌면 즉시 다시 그림 */
function _onMonthRangeChange(){
  monthStart = $('#mFrom').value;
  monthEnd   = $('#mTo').value;
  if(monthStart && monthEnd && monthStart > monthEnd){
    /* 사용자가 시작을 뒤로 늘리면 종료도 같이 밀어줌 (반대도 동일) */
    if(this && this.id === 'mFrom') $('#mTo').value = monthStart, monthEnd = monthStart;
    else $('#mFrom').value = monthEnd, monthStart = monthEnd;
  }
  month = monthEnd;
  draw(); renderCurrentView();
}
$('#mFrom').onchange = _onMonthRangeChange;
$('#mTo').onchange   = _onMonthRangeChange;

/* FEED 기준(연결 1건+) 키워드 중 검색량 상위 5 */
function top5(region, srcOnly){
  return ENTS.filter(e => (CNT[e.entity_id]||0) >= 1)
    .map(e => { const rows = sigOf(e.entity_id, region, srcOnly).filter(r => r.week.slice(0,7) <= month);
      return { e, v: rows.length ? +rows[rows.length-1].volume : -1, c: change4(e.entity_id, region) }; })
    .sort((a,b) => b.v - a.v)
    .slice(0, 5);
}

function ovBlock(title, region, note){
  const list = top5(region, region==='KR' ? 'instagram' : undefined);
  const has = list.some(x => x.v >= 0);
  return `<div class="card" style="margin-bottom:14px">
    <h3>${title} <span class="mini" style="float:right">${note}</span></h3>
    <div class="top5">${list.map((x,i) => `
      <div class="tcard" data-open="${esc(x.e.entity_id)}">
        <span class="rk">${i+1}</span>
        <span class="st ${stageOf(x.e.entity_id)}">${stageOf(x.e.entity_id)}</span>
        ${COVER[x.e.entity_id] ? `<img src="${esc(COVER[x.e.entity_id])}" loading="lazy" alt="">` : '<div style="height:84px;margin:24px 0 8px"></div>'}
        <div class="nm">${esc(x.e.name_kr||x.e.name_en)}</div>
        <div class="ct">${esc(x.e.category_l1||x.e.axis||'')}</div>
      </div>`).join('')}</div>
    <div class="panelrow">
      <div class="card"><h3>${region==='KR' ? '인스타그램 언급량 — TOP 5 한 그래프' : '검색량 추이 — TOP 5'}</h3>
        ${multiLine(list.map((x,i) => ({ name: x.e.name_kr||x.e.name_en, color: LINE5[i],
          rows: sigOf(x.e.entity_id, region, region==='KR' ? 'instagram' : undefined) })))}
      </div>
      <div class="card"><h3>검색량 변화 — 최근 4주 vs 이전 4주</h3>
        ${list.map(x => `<div class="chg"><span>${esc(x.e.name_kr||x.e.name_en)}</span><span class="v">${chgHtml(x.c)}</span></div>`).join('')}
      </div>
    </div>
  </div>`;
}

function draw(){
  /* 제목은 기간과 무관하게 고정 — 선택한 기간은 위쪽 월 선택 상자에서 확인 */

const catOf = e => window.ECAT?.[e.entity_id] || e.category_l1 || '기타';

/* ── 키워드 상세 (이미지 5) ── */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-open]'); if(!t) return;
  const ent = ENTS.find(x => x.entity_id === t.dataset.open); if(!ent) return;
  openDetail(ent);
});
$('#detail .x').onclick = () => { $('#detail').classList.remove('open'); $('#dim').classList.remove('open'); };
$('#dim').onclick = () => $('#detail .x').onclick();

async function openDetail(ent){
  $('#detail').classList.add('open'); $('#dim').classList.add('open');

/* SNS 세부분류 → 카테고리 매핑 (콤마로 여러 개면 첫 번째 기준) */
const SNS_SUBCAT_MAP = { '상의':'top', '아우터':'outer', '바지':'pants', '원피스':'dress',

const CATS = ['lifestyle','outer','top','pants','dress','shoes','bag','acc','etc'];

/* admin.html에서 Supabase trend_signals 테이블로 올린 항목들 — 페이지 로드 시 fetch해서 채움 */
let SB_NEWS = [], SB_LIFESTYLE = [], SB_SNS = [];
let LIFESTYLE_LINKS = [];   /* 라이프스타일 ↔ 다른 카테고리 연결 목록 { life, cat, kw, note, auto } */

/* 너무 흔해서 연결 근거로 쓰기엔 약한 태그 — 칩으로는 보이지만 자동 연결에는 쓰지 않음 */
const GENERIC_TAGS = new Set(['컬러','소재','실루엣','런웨이','셀럽착용','검색량급증','레트로']);

/* ── 라이프스타일 ↔ 패션 카테고리 자동 연결 규칙 ──────────────────────────
   왼쪽: 라이프스타일 키워드 / kws: 연결될 만한 패션 키워드 후보 목록
   후보 중에서 "실제로 등록되어 있는 키워드"만 배지로 표시됩니다.
   (없는 키워드를 가리키는 죽은 배지가 생기지 않도록)
   새 규칙을 추가하려면 아래에 한 줄만 더 쓰면 됩니다.
   Supabase trend_signals에 related / related_keyword / related_note 값을
   직접 넣어둔 항목은 이 규칙보다 우선합니다. */
const LIFE_LINK_RULES = {
  '슬립맥싱': { note:'수면·회복 루틴이 홈웨어·이지웨어 수요로 이어짐',
               kws:['라운지웨어','파자마','슬립 스커트','실크','새틴','니트'] },
  '사우나':   { note:'회복 문화가 리커버리 웨어·물 주변 아이템으로 확장',
               kws:['젤리슈즈','플립플롭','PVC 슈즈','로브','타월'] },
  '러닝':     { note:'러닝 인구 증가가 스포티 아이템 수요로 직결',
               kws:['트랙 쇼츠','핏티드 트랙탑','러닝화','레깅스','빈티지 스포츠웨어'] },
  '웰니스':   { note:'웰니스 루틴이 애슬레저 아이템 수요로',
               kws:['핏티드 트랙탑','레깅스','트랙 쇼츠','빈티지 스포츠웨어'] },
  '등산':     { note:'아웃도어 활동 증가가 기능성 아우터 수요로',
               kws:['윈드브레이커','마이크로 재킷','고어텍스'] },
  '홈카페':   { note:'집에서 보내는 시간이 늘며 편안한 실내복 수요로',
               kws:['라운지웨어','니트','파자마'] },
};

/* 라이프스타일 항목 ↔ 패션 항목 사이의 연결을 계산 (화면에 실제로 떠 있는 데이터 기준)
   우선순위: ① 사람이 직접 지정 ② 해시태그 공유 ③ 규칙 사전 */
function buildLinks(lifeItems, newsItems){
  const links = [];
  const add = (l) => {
    if(links.some(x => normKw(x.life) === normKw(l.life) && normKw(x.kw) === normKw(l.kw))) return;
    links.push(l);
  };
  /* 1) 사람이 직접 지정한 연결 (trend_signals.related / related_keyword) — 최우선 */
  for(const s of lifeItems){
    if(s.related && s.related_keyword){
      add({ life: canonKw((s.keywords||[])[0] || s.note), cat: s.related,
        kw: s.related_keyword, note: s.related_note || '', auto: false });
    }
  }
  const pool = new Map();
  for(const s of newsItems){
    const label = canonKw((s.keywords||[])[0] || s.note);
    const prev = pool.get(normKw(label));
    pool.set(normKw(label), { label, cat: s.category, tags: (s.tags||[]).concat(prev ? prev.tags : []) });
  }
  /* 2) 해시태그를 공유하면 자동 연결 — 태그를 붙일수록 정확해짐 */
  for(const s of lifeItems){
    const life = canonKw((s.keywords||[])[0] || s.note);
    const lifeTags = (s.tags || []).filter(t => !GENERIC_TAGS.has(t));
    if(!lifeTags.length) continue;
    for(const [, hit] of pool){
      const shared = (hit.tags || []).filter(t => lifeTags.includes(t));
      if(!shared.length) continue;
      add({ life, cat: hit.cat, kw: hit.label, note: `#${shared.join(' #')} 공유`, auto: true });
    }
  }
  /* 3) 규칙 사전 기반 자동 연결 — 태그가 아직 없는 항목을 위한 보조 */
  for(const s of lifeItems){
    const life = canonKw((s.keywords||[])[0] || s.note);
    const rule = LIFE_LINK_RULES[life]; if(!rule) continue;
    for(const cand of rule.kws){
      const hit = pool.get(normKw(cand)); if(!hit) continue;
      add({ life, cat: hit.cat, kw: hit.label, note: rule.note, auto: true });
    }
  }
  return links;
}

/* 월 구분 기준 = 시트 탭(sheet_month). 없으면 발행일 → 등록일 순으로 대체 */
const ymOf = r => String(r.sheet_month || r.published_at || r.created_at || '').slice(0, 7);

/* 월 범위 컨트롤(시작월 ~ 종료월). 실제 데이터에 있는 발행월들로 옵션을 채움.
   기본값: 데이터에 이번 달이 있으면 이번 달만, 없으면 데이터의 가장 최신 월 하나 */
function buildMonthOptions(){
  const months = [...new Set([...SB_NEWS, ...SB_LIFESTYLE, ...SB_SNS].map(s => s.ym).filter(Boolean))]
    .sort();   /* 오래된 → 최신 순 */
  if(!months.length){ $('#mFrom') && ($('#mFrom').innerHTML = ''); $('#mTo') && ($('#mTo').innerHTML = ''); draw(); return; }
  const opts = months.map(m => `<option value="${m}">${m.replace('-', '년 ')}월</option>`).join('');
  $('#mFrom').innerHTML = opts;
  $('#mTo').innerHTML   = opts;
  /* 기본값 결정: 데이터에 이번 달이 있으면 그것만, 아니면 최신 월 하나 */
  const now = _thisYm;
  const defaultYm = months.includes(now) ? now : months[months.length - 1];
  if(!months.includes(monthStart)) monthStart = defaultYm;
  if(!months.includes(monthEnd))   monthEnd   = defaultYm;
  if(monthStart > monthEnd){ const t = monthStart; monthStart = monthEnd; monthEnd = t; }
  $('#mFrom').value = monthStart;
  $('#mTo').value   = monthEnd;
  month = monthEnd;   /* 예전 API 호환용 */
  draw();
}

/* 선택한 월 범위(monthStart~monthEnd)에 해당하는 항목만 통과. 발행월 정보가 없는 정적 데이터는 항상 통과 */
const inMonth = s => !s.ym || (s.ym >= monthStart && s.ym <= monthEnd);
/* 선택한 해시태그가 있으면 그 태그가 달린 항목만 통과 */
/* ── 태그 클러스터 사전 ─────────────────────────────────────
   대표 키워드 → 그 밑에 묶이는 유사 키워드들.
   Supabase의 tag_clusters 테이블에서 로드함 (loadTagClusters).
   테이블은 아직 없거나 로드 실패하면 빈 사전으로 동작(각 태그가 자기 자신을 대표). */
let CLUSTERS = {};
let CLUSTERS_KO = {};   /* 대표 → 한국어 별칭 배열 (검색용) */

let TAG_TO_HEAD = {};   /* 유사 → 대표 역인덱스, CLUSTERS 로드 시 자동 재계산 */
function rebuildTagIndex(){
  TAG_TO_HEAD = {};
  for(const [head, arr] of Object.entries(CLUSTERS)){
    for(const t of arr){ if(!(t in TAG_TO_HEAD)) TAG_TO_HEAD[t] = head; }
  }
}

async function loadTagClusters(){
  try {
    const { data, error } = await sb.from('tag_clusters').select('head, members, ko_aliases');
    if(error) throw error;
    const next = {}, nextKo = {};
    for(const r of (data || [])){
      next[r.head] = r.members || [];
      nextKo[r.head] = r.ko_aliases || [];
    }
    CLUSTERS = next; CLUSTERS_KO = nextKo;
    rebuildTagIndex();
  } catch(e){
    console.warn('tag_clusters 로드 실패 — 사전 없이 동작:', e?.message || e);
    CLUSTERS = {}; CLUSTERS_KO = {}; rebuildTagIndex();
  }
}

const inTag = s => {
  if(!tagFilter) return true;
  const tags = s.tags || [];
  /* 클러스터 필터: 대표 키워드가 선택됐으면 대표 + 유사 태그 중 하나라도 카드에 있으면 통과 */
  const cluster = CLUSTERS[tagFilter];
  if(cluster){
    if(tags.includes(tagFilter)) return true;
    return cluster.some(t => tags.includes(t));
  }
  /* 일반(클러스터 아닌) 태그는 예전처럼 정확 일치 */
  return tags.includes(tagFilter);
};
/* 화면에 실제로 그릴지 판단하는 최종 필터 */
const visible = s => inMonth(s) && inTag(s);

async function loadTrendSignals(){
  try{
    const { data, error } = await sb.from('trend_signals').select('*').order('created_at', { ascending: false });
    if(error){ console.warn('trend_signals 로드 실패 (테이블이 아직 없을 수 있음):', error.message); return; }
    SB_NEWS = []; SB_LIFESTYLE = []; SB_SNS = [];
    for(const r of (data || [])){
      if(!r.keyword) continue;
      /* 사내 리포트에서 등록한 항목은 TREND SIGNAL에 넣지 않는다.
         여기는 엑셀로 모은 기사와 +수집으로 올린 SNS 자료만 보여주는 화면이고,
         사내 리포트와 Lyst 자료는 시즌 리포트 · KEY BRAND에서만 쓴다. */
      if(String(r.source || '').trim() === '사내 리포트') continue;
      if(r.source_type === 'news'){
        SB_NEWS.push({ id: r.id, url: r.url, note: r.keyword, category: REV_CAT_LABEL[r.category] || r.category || 'etc',
          keywords: [r.keyword], summary: r.note || '', image_url: r.image_url, extra_images: r.extra_images || [], stage: 'early',
          source: r.source, region: r.region, author: r.author, tags: canonTags(r.tags), ym: ymOf(r) });
      } else if(r.source_type === 'lifestyle'){
        SB_LIFESTYLE.push({ id: r.id, url: r.url, note: r.keyword, category: 'lifestyle',
          keywords: [r.keyword], summary: r.note || '', image_url: r.image_url, extra_images: r.extra_images || [], stage: 'early',
          related: r.related || null, related_keyword: r.related_keyword || '', related_note: r.related_note || '',
          source: r.source, region: r.region, author: r.author, tags: canonTags(r.tags), ym: ymOf(r) });
      } else if(r.source_type === 'sns'){
        SB_SNS.push({ id: r.id, category: REV_CAT_LABEL[r.category] || r.category || 'etc', keyword: r.keyword,

let runwaySeasonSel = '26FW';
const CONNECTORS = new Set(['de','des','van','der','di','da','la','le','el','du','von','of','and','the','den','ten','op']);
function brandFromFilename(fn){
  let base = String(fn || '').replace(/\.[^.]+$/, '').replace(/^\s*\d+\s*[-_]\s*/, '');  /* 맨 앞 '숫자-' 접두어 제거(있을 때만) */
  const parts = base.split('_').filter(Boolean);
  const out = [];
  for(const p of parts){
    if(/^[A-Z]/.test(p) || CONNECTORS.has(p.toLowerCase())) out.push(p);
    else break;                  /* 첫 소문자 브랜드코드 만나면 멈춤 */
  }
  let brand = out.join(' ').trim();
  if(!brand) brand = (parts[0] || base);
  return brand;
}

function normKw(k){ return String(k||'').trim().toLowerCase(); }

/* admin.html 설정 탭에서 등록한 키워드 동의어(예: 젤꾸 → 젤리슈즈) — 로드되면 채워짐 */
let ALIAS_MAP = {};
function canonKw(raw){ return ALIAS_MAP[normKw(raw)] || raw; }

/* ── 해시태그 대표어 사전 (tag_aliases) ───────────────────────
   alias(유사어) → canonical(대표어). 로드 시 태그에 자동 적용해 버블/카드가
   대표어로 합산되게 한다(원본 카드 행은 그대로 두고, 화면 표시만 대표어로). */
let TAG_ALIAS = {};   /* normKw(alias) → canonical */
function canonTag(t){ return TAG_ALIAS[normKw(t)] || t; }
function canonTags(arr){
  const out = [], seen = new Set();
  for(const t of (arr || [])){
    const c = canonTag(t), k = normKw(c);
    if(c && !seen.has(k)){ seen.add(k); out.push(c); }
  }
  return out;
}
async function loadTagAliases(){
  try{
    const { data, error } = await sb.from('tag_aliases').select('alias,canonical');
    if(error){ console.warn('tag_aliases 로드 실패(테이블이 아직 없을 수 있음):', error.message); TAG_ALIAS = {}; return; }
    TAG_ALIAS = Object.fromEntries((data || []).map(r => [normKw(r.alias), r.canonical]));
  }catch(e){ console.warn('tag_aliases 로드 실패:', e); TAG_ALIAS = {}; }
}

/* 같은 기사가 두 번 등록된 경우를 화면에서 걸러냄.
   원문 URL은 인코딩 방식이 달라 문자열이 다를 수 있어서, 이미지 URL을 우선 기준으로 씀 */
function itemKey(it){
  const kw = normKw((it.keywords||[])[0] || it.keyword || it.note || '');
  const ref = String(it.image_url || it.url || it.post_url || '').toLowerCase();
  return `${kw}|${ref}`;
}
function dedupeItems(items){
  const seen = new Set(), out = [];
  for(const it of items){
    const k = itemKey(it);
    if(seen.has(k)) continue;
    seen.add(k); out.push(it);
  }
  return out;
}

/* 뉴스레터: 기사에 태깅된 keywords를 병합·집계 (동일 키워드 기사 여러 건이면 합쳐서 카운트) */
function aggregateNewsKw(items){
  const map = new Map();
  for(const s of dedupeItems(items)){
    const kws = (s.keywords && s.keywords.length) ? s.keywords : [s.note.slice(0,24)];
    for(const raw of kws){
      const label = canonKw(raw);
      const key = normKw(label);
      if(!map.has(key)) map.set(key, { label, count: 0, items: [] });
      const e = map.get(key); e.count++; e.items.push(s);
    }
  }
  return [...map.values()].sort((a,b) => b.count - a.count);
}

/* SNS: 콘텐츠에 실제로 달린 해시태그를 키워드로 집계 (브랜드명 나열이 아니라 진짜 쓰인 태그 기준).
   홍보성 상투어(광고/협찬 등)는 제외. 해시태그가 없는 콘텐츠는 집계에서 빠지고 별도 카운트 */
const SNS_TAG_STOPWORDS = new Set(['광고','협찬','제작비지원','제품제공','서포터즈','기자단']);
function extractHashtags(content){
  const tags = [...(content||'').matchAll(/#([^\s#]+)/g)].map(m => m[1]);
  return [...new Set(tags)].filter(t => !SNS_TAG_STOPWORDS.has(t));
}
function aggregateSnsKw(items){
  const map = new Map();
  let genericCount = 0;
  for(const s of items){
    const tags = extractHashtags(s.content);
    if(!tags.length){ genericCount++; continue; }
    for(const raw of tags){
      const label = '#' + canonKw(raw);
      const key = normKw(label);
      if(!map.has(key)) map.set(key, { label, count: 0, score: 0, items: [] });
      const e = map.get(key); e.count++; e.score += s.score; if(!e.items.includes(s)) e.items.push(s);
    }
  }
  const ranked = [...map.values()].sort((a,b) => b.score - a.score || b.count - a.count);
  return { ranked, genericCount };
}

   해시태그 필터로 여러 카드를 한번에 볼 수 있음. 모든 카드는 동일 크기·구조. */
function itemCardHTML(entry, it){

        ? `<div class="relhide" style="display:none">${fwd.slice(REL_MAX).map(relBtn).join('')}</div>`

  const backs = scatF === 'lifestyle' ? []

  /* 이 원문에 달린 해시태그 — 누르면 같은 태그 카드만 필터링. 연필 아이콘으로 편집 모드 진입 가능 */

    ${link ? `<a class="kwlink" href="${esc(link)}" target="_blank" rel="noopener">${linkLabel} →</a>` : ''}
